<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- 背景に敷く柄(オリジナルの線画)。鍛冶の道具とスライム。
       数字の読みやすさを損なわないよう、色はごく薄くしてある。 -->
  <g fill="none" stroke="#7a5c28" stroke-opacity=".13" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- ハンマー -->
    <g transform="translate(58 62) rotate(-35)">
      <rect x="-4" y="-6" width="8" height="54" rx="3"/>
      <rect x="-20" y="-20" width="40" height="16" rx="3"/>
      <path d="M-14 -20 v16 M14 -20 v16"/>
    </g>
    <!-- 金床 -->
    <g transform="translate(205 70)">
      <path d="M-38 -14 H30 Q42 -14 46 -22 Q44 -4 22 -2 L14 12 H24 V20 H-24 V12 H-14 L-20 -2 Q-38 -4 -38 -14 Z"/>
      <path d="M-30 -8 H26"/>
    </g>
    <!-- 炎 -->
    <g transform="translate(66 222)">
      <path d="M0 26 C-18 26 -24 10 -16 -2 C-12 6 -6 6 -6 0 C-6 -12 2 -20 4 -28 C10 -16 22 -8 20 8 C19 20 10 26 0 26 Z"/>
      <path d="M0 20 C-7 20 -9 12 -5 7 C-2 11 2 10 2 5 C6 9 8 13 6 16 C5 19 3 20 0 20 Z"/>
    </g>
    <!-- インゴット -->
    <g transform="translate(150 158)">
      <path d="M-26 10 L-18 -8 H18 L26 10 Z"/>
      <path d="M-18 -8 L-12 -2 H12 L18 -8"/>
    </g>
    <!-- スライム(しずく形の体、頭の先が巻いたとんがり) -->
    <g transform="translate(222 226)">
      <path d="M0 -30 C4 -26 6 -22 4 -18 C14 -12 30 2 30 14 C30 24 18 28 0 28 C-18 28 -30 24 -30 14 C-30 2 -14 -12 -4 -18 C-6 -24 -3 -28 0 -30 Z"/>
    </g>
  </g>
  <!-- スライムの顔(大きな目と、にっこり開いた口)と火花は塗りで -->
  <g fill="#7a5c28" fill-opacity=".15">
    <ellipse cx="211" cy="232" rx="4" ry="5.5"/><ellipse cx="233" cy="232" rx="4" ry="5.5"/>
    <path d="M206 242 Q222 258 238 242 Q222 248 206 242 Z"/>
  </g>
  <g fill="#b5480f" fill-opacity=".10">
    <!-- 火花(4方向の星) -->
    <path d="M118 44 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
    <path d="M252 142 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
    <path d="M30 140 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
    <path d="M140 268 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z"/>
  </g>
</svg>
