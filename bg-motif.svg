<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- 背景に敷く柄(オリジナルの線画)。鍛冶の道具とスライム。
       数字の読みやすさを損なわないよう、色はごく薄くしてある。 -->
  <g fill="none" stroke="#7a5c28" stroke-opacity=".13" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- ハンマー -->
    <g transform="translate(58 62) rotate(-35)">
      <rect x="-4" y="-6" width="8" height="54" rx="3"/>
      <rect x="-20" y="-20" width="40" height="16" rx="3"/>
      <path d="M-14 -20 v16 M14 -20 v16"/>
    </g>
    <!-- 金床 -->
    <g transform="translate(205 70)">
      <path d="M-38 -14 H30 Q42 -14 46 -22 Q44 -4 22 -2 L14 12 H24 V20 H-24 V12 H-14 L-20 -2 Q-38 -4 -38 -14 Z"/>
      <path d="M-30 -8 H26"/>
    </g>
    <!-- 炎 -->
    <g transform="translate(66 222)">
      <path d="M0 26 C-18 26 -24 10 -16 -2 C-12 6 -6 6 -6 0 C-6 -12 2 -20 4 -28 C10 -16 22 -8 20 8 C19 20 10 26 0 26 Z"/>
      <path d="M0 20 C-7 20 -9 12 -5 7 C-2 11 2 10 2 5 C6 9 8 13 6 16 C5 19 3 20 0 20 Z"/>
    </g>
    <!-- インゴット -->
    <g transform="translate(150 158)">
      <path d="M-26 10 L-18 -8 H18 L26 10 Z"/>
      <path d="M-18 -8 L-12 -2 H12 L18 -8"/>
    </g>
    <!-- スライム(利用者から提供されたフリー素材の絵をなぞった線画。元絵は約2000×1600の座標) -->
    <g transform="translate(222 222) scale(.056) translate(-975 -760)">
      <path vector-effect="non-scaling-stroke" d="M1010 240 C1045 240 1055 290 1065 330 C1085 420 1100 500 1140 560 C1200 620 1300 650 1360 670 C1480 730 1530 850 1525 940 C1520 1080 1400 1200 1250 1240 C1100 1280 850 1285 700 1250 C540 1215 430 1100 430 950 C430 820 540 720 650 660 C750 610 840 580 890 520 C930 470 955 380 970 300 C980 260 995 240 1010 240 Z"/>
      <ellipse vector-effect="non-scaling-stroke" cx="875" cy="905" rx="92" ry="98"/>
      <ellipse vector-effect="non-scaling-stroke" cx="1115" cy="888" rx="90" ry="95"/>
      <path vector-effect="non-scaling-stroke" d="M750 1050 C790 1020 850 1040 900 1070 C960 1100 1040 1100 1110 1080 C1170 1060 1210 1000 1255 1005 C1290 1010 1280 1060 1250 1080 C1180 1140 1080 1175 980 1170 C880 1168 780 1130 750 1095 C735 1075 740 1058 750 1050 Z"/>
    </g>
  </g>
  <!-- スライムの黒目 -->
  <g fill="#7a5c28" fill-opacity=".16" transform="translate(222 222) scale(.056) translate(-975 -760)">
    <circle cx="877" cy="907" r="37"/><circle cx="1112" cy="890" r="35"/>
  </g>
  <g fill="#b5480f" fill-opacity=".10">
    <!-- 火花(4方向の星) -->
    <path d="M118 44 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
    <path d="M252 142 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
    <path d="M30 140 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
    <path d="M140 268 l2.5 7 7 2.5 -7 2.5 -2.5 7 -2.5 -7 -7 -2.5 7 -2.5 z"/>
  </g>
</svg>
