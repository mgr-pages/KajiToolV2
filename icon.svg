<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- アプリのアイコン(元の絵)。ホーム画面・タブ用の PNG は node tools/make-icons.js で、この絵から作る。
       絵を変える時はこのファイルを直して作り直すこと。PNG を手で直さない。
       焦茶の地に、金色の金床とハンマー、打った所から出る火花。小さく表示しても形が崩れないよう、細部を省いてある。
       Android のアイコンは丸などに切り抜かれるので、切り抜き用(maskable)は絵を縮めて作る(make-icons.js)。 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#5a3d1a"/><stop offset="1" stop-color="#2b1d0b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d27a"/><stop offset="1" stop-color="#b8901f"/>
    </linearGradient>
    <linearGradient id="hgold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7dc8e"/><stop offset="1" stop-color="#c9a02c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 金床 -->
  <path d="M66 300 Q108 292 152 292 L426 292 L426 336 L372 344 Q342 350 340 380 L340 402 L384 402 L396 438 L116 438 L128 402 L172 402 L172 380 Q170 350 140 344 Q104 338 66 300 Z" fill="url(#gold)"/>
  <!-- ハンマー(金床の右寄りを打つ) -->
  <g transform="translate(322 211) rotate(-28)">
    <rect x="30" y="-14" width="150" height="28" rx="13" fill="url(#hgold)"/>
    <rect x="-42" y="-72" width="84" height="144" rx="12" fill="url(#hgold)"/>
    <rect x="-42" y="-72" width="84" height="144" rx="12" fill="none" stroke="#2b1d0b" stroke-width="8"/>
  </g>
  <!-- 火花(打った所から) -->
  <path d="M232 150 L248 204 L302 220 L248 236 L232 290 L216 236 L162 220 L216 204 Z" fill="#ffe08a"/>
  <circle cx="150" cy="150" r="11" fill="#ffe08a"/><circle cx="286" cy="128" r="8" fill="#ffe08a"/><circle cx="132" cy="262" r="7" fill="#ffe08a"/>
</svg>
