<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- 風化した紙の質感。細かな繊維の粒と、大きくにじんだ染みを重ねる。
       模様は乱数から作るので画像ファイルを持たずに済む。 -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .14  0 0 0 .10 0"/>
  </filter>
  <filter id="stain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .16  0 0 0 -1.4 .78"/>
  </filter>
  <rect width="400" height="400" filter="url(#stain)" opacity=".55"/>
  <rect width="400" height="400" filter="url(#grain)"/>
</svg>
