<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>超素材を作ろう！</title>
<style>
:root{
  /* 冒険の書調。生成りの紙地に焦茶の文字。
     補助バーの4色は暗い地を前提に彩度を決めていたため、
     明るい地でも沈まないよう明度を下げ直してある。 */
  --bg:#f0e2c2; --bg2:#f7ecd6; --panel:#fbf3e0; --line:#c6ac74;
  --text:#4a3418; --dim:#7d6842;
  --ember:#b5480f; --gold:#8a6a12;
  --blue:#1c6fc4; --red:#c42a2a; --green:#217a3f; --pink:#c41a8f;
  --ink:#7a5c28;          /* 枠の濃い方 */
  --sunk:#e6d5ae;         /* バーやテンキーの窪んだ面 */
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  overscroll-behavior:none;}
body{padding-bottom:96px;}
input,select,button{font-family:inherit; -webkit-appearance:none; appearance:none;}

/* ===== ヘッダー ===== */
.hdr{position:sticky; top:0; z-index:30; background:var(--bg2); border-bottom:1px solid var(--line);
  padding:8px 10px;}
.hdr-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:5px 9px; font-size:12px; display:flex; align-items:baseline; gap:5px; flex:1; min-width:0;}
.stat .lbl{color:var(--dim); font-size:10px; white-space:nowrap;}
.stat .val{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;}
.stat.tap{cursor:pointer;}
.stat.tap:active{background:#e6d5ae;}
.badges{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap;}
.badge{font-size:10.5px; padding:3px 8px; border-radius:20px; font-weight:700;}
.badge.boost{background:rgba(138,106,18,.13); color:var(--gold); border:1px solid rgba(138,106,18,.5);}
.badge.half{background:rgba(28,111,196,.12); color:var(--blue); border:1px solid rgba(28,111,196,.45);}
.badge.rate{background:rgba(47,138,76,.12); color:var(--green); border:1px solid rgba(47,138,76,.4);}
.badge.off{background:var(--panel); color:var(--dim); border:1px solid var(--line);}

/* ===== ヘッダー上段:今どの商材をどの装備で打っているか ===== */
.hdr-title{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
.hdr-title .mat{font-size:14px; font-weight:800; color:var(--gold);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
.hdr-title .mat-sel{background:var(--panel); border:1px solid var(--line);
  color:var(--gold); font-size:14px; font-weight:800; border-radius:6px;
  padding:7px 26px 7px 10px; min-width:0; flex:1 1 auto; max-width:none;
  appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
    linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%, calc(100% - 9px) 52%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat;}
.hdr-title .hdr-reset{background:var(--panel); border:1px solid rgba(181,72,15,.6);
  color:var(--ember); border-radius:6px; padding:8px 13px; font-size:12.5px;
  font-weight:800; white-space:nowrap; flex:0 0 auto;}
.hdr-title .hdr-reset:active{background:var(--ember); color:#fbf3e0;}
/* 装備表示は情報としては最も弱いので、幅が足りない時はここだけを詰める */
.hdr-title .gear{font-size:10.5px; color:var(--dim); white-space:nowrap;
  margin-left:auto; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;}

.cand-q{font-size:14px; font-weight:700; text-align:center; margin:2px 0 10px;}
.cand-grp{margin-bottom:10px;}
.cand-h{font-size:12px; display:block; margin-bottom:5px; font-weight:700;}
.cand-h.n{color:var(--dim);}
.cand-h.c{color:var(--pink);}
.cand-row{display:grid; grid-template-columns:repeat(auto-fill,minmax(66px,1fr)); gap:6px;}
.cand{background:var(--panel); border:1px solid var(--line); color:var(--text);
  border-radius:7px; padding:13px 4px; font-size:17px; font-weight:700;
  font-variant-numeric:tabular-nums;}
.cand:active{background:var(--ember); color:#fbf3e0;}
.cand.crit{border-color:rgba(196,26,143,.5); color:var(--pink);}
.cand.crit:active{background:var(--pink); color:#fbf3e0;}
.cand-more{width:100%; background:transparent; border:1px dashed var(--line);
  color:var(--dim); border-radius:7px; padding:10px; font-size:12.5px; margin:2px 0 10px;}
/* ===== 推奨手順:各手の右に「ここまで実行」ボタン ===== */
.pstep{display:flex; align-items:center; gap:8px; padding:5px 4px; border-radius:6px;}
.pstep + .pstep{margin-top:4px;}
.pstep .n{color:var(--gold); font-weight:800; min-width:18px; font-size:12px; text-align:right;}
.pstep .pinfo{flex:1; min-width:0;}
.pstep .pname{font-size:12.5px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pstep .ptg{font-size:10.5px; color:var(--dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.pstep.on-boost{background:rgba(138,106,18,.13); border-left:3px solid var(--gold);}
.pstep.on-half{background:rgba(28,111,196,.11); border-left:3px solid var(--blue);}
.pstep.first{box-shadow:inset 0 0 0 1px rgba(181,72,15,.55);}
.pexec{flex:0 0 auto; background:var(--panel); border:1px solid var(--line);
  color:var(--text); border-radius:6px; padding:6px 9px; line-height:1.2; font-weight:700;}
.pexec:active{background:#e6d5ae;}
.pexec .t{display:block; font-size:11px; color:var(--gold);}
.pexec .s{display:block; font-size:9px; color:var(--dim); font-weight:600;}
.pexec .s.ok{color:var(--green);}
.pexec .s.warn{color:var(--dim); text-decoration:line-through;}
.plist-note{font-size:10px; color:var(--dim); line-height:1.5; margin:8px 2px 0;}
.dup-line{font-size:10.5px; color:var(--dim); text-align:center; margin:8px 0 4px;
  border-top:1px dashed var(--line); padding-top:6px;}
.badge.wait{background:rgba(181,72,15,.12); color:var(--ember);
  border:1px solid rgba(181,72,15,.45);}
.badge.weak{background:rgba(138,117,80,.14); color:var(--dim); border:1px solid var(--line);}
.mk-weak{ color:var(--dim); font-size:10.5px; font-weight:800; white-space:nowrap; }
.pstep.on-weak{background:rgba(138,117,80,.13); border-left:3px solid var(--line);}
.plist-body{max-height:38vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  border:1px solid var(--line); border-radius:6px; padding:5px;}
.hist-acc{margin:0 0 10px;}
.hist-acc summary{font-size:11.5px; padding:7px 10px;}
.hist-body{max-height:20vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  border:1px solid var(--line); border-radius:0 0 6px 6px; border-top:0; padding:5px;}
.hstep{display:flex; gap:8px; align-items:baseline; font-size:11.5px; padding:2px 2px;}
.hstep .n{color:var(--dim); font-weight:800; min-width:20px; text-align:right;}
.hstep .hn{font-weight:700;}
.hstep .ht{color:var(--dim); font-size:10.5px; margin-left:auto; white-space:nowrap;}
.lg-tg{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim);
  width:100%; margin-top:2px;}
/* ===== 実行済みの反映 ===== */
.exec{margin-top:8px; border-top:1px solid var(--line); padding-top:8px;}
.exec-lbl{font-size:11px; color:var(--dim); margin-bottom:6px;}
.exec-row{display:flex; gap:5px;}
.exec-btn{flex:1; min-width:0; background:var(--panel); border:1px solid var(--line);
  color:var(--text); border-radius:6px; padding:6px 2px; font-weight:700; line-height:1.25;}
.exec-btn:active{background:#e6d5ae;}
.exec-btn .n{display:block; font-size:14px; color:var(--gold);}
.exec-btn .s{display:block; font-size:9px; color:var(--dim); font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.need-box{background:rgba(181,72,15,.11); border:1px solid rgba(181,72,15,.55);
  border-radius:8px; padding:9px 10px;}
.need-box .t{font-size:12px; font-weight:800; color:var(--ember); margin-bottom:3px;}
.need-box .d{font-size:10.5px; color:var(--dim); margin-bottom:7px;}
.need-row{display:flex; gap:6px; flex-wrap:wrap;}
.need-btn{background:var(--ember); color:#180f0a; border:0; border-radius:6px;
  padding:7px 13px; font-size:12px; font-weight:800;}
.need-btn.ok{background:var(--panel); color:var(--dim); border:1px solid var(--line);}
.undo-btn{margin-top:7px; width:100%; background:transparent; border:1px solid var(--line);
  color:var(--dim); border-radius:6px; padding:6px; font-size:11px;}
.calc:disabled{opacity:.45;}
.cell.need{border-color:var(--ember) !important; animation:needpulse 1.3s ease-in-out infinite;}
@keyframes needpulse{0%,100%{box-shadow:0 0 0 0 rgba(181,72,15,.55);}
  50%{box-shadow:0 0 0 5px rgba(181,72,15,0);}}

/* ===== 盤面 ===== */
.board{padding:10px 6px;}
.brow{display:flex; align-items:stretch; gap:4px; margin-bottom:8px;}
.bar-wrap{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px;}
.bar-wrap.left{align-items:flex-end;}
.zone-lbl{font-size:9.5px; color:var(--green); font-weight:700; font-variant-numeric:tabular-nums;}
.bar{position:relative; width:100%; height:16px; background:var(--sunk); border:1px solid var(--line);
  border-radius:2px; overflow:hidden;}
.bar i{position:absolute; display:block;}
/* 4つの帯を高さで段違いに重ねて、同時に読めるようにする */
/* 成功ゾーンは最重要なので濃く塗り、両端に境界線を立てて範囲を明示する。
   本会心ゾーンとは色味も明度も離しておく。 */
.bar .m-green{top:0; bottom:0; z-index:2; background:rgba(47,138,76,.34);
  border-left:2px solid var(--green); border-right:2px solid var(--green); box-sizing:border-box;}
.bar .m-pink {top:0; bottom:0; z-index:1; background:rgba(196,26,143,.18);
  border-left:1px dashed rgba(196,26,143,.75); border-right:1px dashed rgba(196,26,143,.75);
  box-sizing:border-box;}
.bar .m-blue {top:2px; z-index:3; height:5px; background:var(--blue); border-radius:2px;}
.bar .m-red  {bottom:2px; z-index:3; height:5px; background:var(--red);  border-radius:2px;}
/* 現在値は0からの塗りで表す。線より進捗が掴みやすい。
   塗り自体は他のマーカーを隠さないよう最背面(z-index:0)、
   右端の白線だけは常に見えるように別要素で最前面に出す。 */
.bar .m-cur  {top:0; bottom:0; left:0; background:rgba(122,92,40,.28); z-index:0;}
.bar .m-curline{top:0; bottom:0; width:2px; background:#4a3418; z-index:6;}
/* 左列のバーは右から左へ伸びるので、全体をミラーする */
.bar.flip{ transform:scaleX(-1); }
.pw-lbl{font-size:9px; color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:-.2px;}

.cell{width:96px; flex:0 0 96px; background:var(--panel); border:2px solid var(--line);
  border-radius:5px; overflow:hidden;}
.cell.hi{border-color:var(--ember); box-shadow:0 0 0 2px rgba(181,72,15,.3);}
.cell.done{border-color:var(--green);}
.cell.over{border-color:var(--red);}
.cell .cur{font-size:27px; font-weight:800; text-align:center; padding:5px 2px 3px;
  font-variant-numeric:tabular-nums; line-height:1;}
.cell.done .cur{color:var(--green);}
.cell.over .cur{color:var(--red);}
.cell .zn{display:flex; border-top:1px solid var(--line); font-size:13px;
  font-variant-numeric:tabular-nums;}
.cell .zn span{flex:1; text-align:center; padding:3px 0; color:var(--dim);}
.cell .zn span:first-child{border-right:1px solid var(--line);}
.cell .no{position:absolute;}

/* ===== 数値の表示(案1) =====
   盤面の6つの値は常に比較対象なので、等幅数字と字形を明示して桁を揃える。
   0と6、1と7の取り違えは実プレイで致命的なため、判別性の高い書体から順に指定する。
   外部フォントは読み込まないので単一ファイルのまま。 */
.cell .cur, .cell .zn, .stat .val, .zone-lbl, .pw-lbl,
.pad-disp, .pad-res, table.sk, .zrow input, .cand, .pexec .s, .hstep .ht{
  font-family:"IBM Plex Sans","Source Sans 3","Noto Sans","Segoe UI",
    "Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums lining-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
}

/* ===== 状態変化の合図(案5) =====
   値が変わった瞬間だけ動かす。装飾ではなく「反映された」ことの確認に限る。 */
@keyframes fxPulse{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes fxShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}
  75%{transform:translateX(3px)}}
@keyframes fxEnter{0%{box-shadow:0 0 0 0 rgba(33,122,63,.55)}
  100%{box-shadow:0 0 0 10px rgba(33,122,63,0)}}
.cell.fx-pulse{animation:fxPulse .42s ease;}
.cell.fx-shake{animation:fxShake .3s ease;}
.cell.fx-enter{animation:fxPulse .42s ease, fxEnter .6s ease;}
@media (prefers-reduced-motion: reduce){
  .cell.fx-pulse,.cell.fx-shake,.cell.fx-enter{animation:none;}
}

/* ===== 折りたたみ ===== */
.acc{margin:0 8px 8px;}
.acc summary{background:var(--panel); border:1px solid var(--line); border-radius:6px;
  padding:11px 12px; font-size:13.5px; font-weight:700; cursor:pointer; list-style:none;
  display:flex; justify-content:space-between; align-items:center;}
.acc summary::-webkit-details-marker{display:none;}
.acc summary::after{content:'▾'; color:var(--dim); transition:transform .15s;}
.acc[open] summary::after{transform:rotate(180deg);}
.acc .body{background:var(--bg2); border:1px solid var(--line); border-top:none;
  border-radius:0 0 6px 6px; padding:10px 12px; font-size:12.5px;}

table.sk{width:100%; border-collapse:collapse; font-size:11.5px;
  font-variant-numeric:tabular-nums;}
table.sk th{color:var(--dim); font-size:10px; text-align:left; padding:4px 3px;
  border-bottom:1px solid var(--line); font-weight:600;}
table.sk td{padding:5px 3px; border-bottom:1px solid rgba(198,172,116,.6);}
table.sk .rolls{color:var(--gold); letter-spacing:-.3px;}
table.sk .cst{text-align:right; font-weight:700;}

.plan-step{display:flex; gap:7px; padding:3px 0; font-size:12px; align-items:baseline;}
.plan-step .n{color:var(--gold); font-weight:800; min-width:17px;}
.plan-step .tg{color:var(--dim); font-size:11px;}

/* ===== 設定 ===== */
.set-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
.set-row label{font-size:11.5px; color:var(--dim); width:76px; flex:0 0 76px;}
.set-row select,.set-row input{flex:1; background:var(--bg); border:1px solid var(--line);
  color:var(--text); padding:9px 8px; border-radius:5px; font-size:16px;}

/* ===== 下部の推奨バー ===== */
.foot{position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--bg2); border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
.rec{display:flex; align-items:center; gap:9px; margin-bottom:7px; min-height:38px;}
.rec-main{flex:1; min-width:0;}
.rec-skill{font-size:16px; font-weight:800; color:var(--ember); line-height:1.25;}
.rec-sub{font-size:11.5px; color:var(--dim); margin-top:1px;}
.rec-empty{font-size:13px; color:var(--dim);}
.calc{width:100%; background:linear-gradient(180deg,var(--ember),#8f3708); color:#fbf3e0;
  border:none; border-radius:7px; padding:13px; font-size:16px; font-weight:800; cursor:pointer;}
.calc:active{filter:brightness(.9);}
.calc:disabled{background:var(--panel); color:var(--dim);}

/* ===== テンキー ===== */
.modal{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.75);
  display:none; align-items:flex-end;}
.modal.show{display:flex;}
.pad{width:100%; background:var(--bg2); border-radius:14px 14px 0 0; padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.pad-hd{text-align:center; font-size:13px; color:var(--dim); margin-bottom:9px;}
.pad-tabs{display:flex; gap:6px; margin-bottom:10px;}
.pad-tabs button{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--dim);
  padding:9px; border-radius:6px; font-size:12.5px; font-weight:700;}
.pad-tabs button.on{background:var(--ember); border-color:var(--ember); color:#fbf3e0;}
.pad-disp{background:var(--sunk); border:1px solid var(--line); border-radius:7px; padding:12px;
  font-size:32px; font-weight:800; text-align:right; margin-bottom:11px;
  font-variant-numeric:tabular-nums; min-height:58px;}
.pad-disp .pre{font-size:14px; color:var(--dim); font-weight:400; margin-right:7px;}
.keys{display:grid; grid-template-columns:repeat(3,1fr); gap:7px;}
.keys button{background:var(--panel); border:1px solid var(--line); color:var(--text);
  padding:16px; font-size:21px; font-weight:700; border-radius:7px;}
.keys button:active{background:#e6d5ae;}
.keys button.wide{grid-column:span 2;}
.keys button.ok{background:var(--ember); border-color:var(--ember); color:#fbf3e0;}
.keys button.del{color:var(--ember);}

/* ===================== PC・タブレット向け =====================
   スマホ前提の寸法だと大画面で間延びして見えるため、
   幅に応じて拡大し、横並びの2カラムに切り替える。 */
@media (min-width: 760px){
  body{ padding-bottom:0; max-width:1180px; margin:0 auto; }

  .hdr{ padding:14px 20px; }
  .stat{ padding:9px 16px; flex:0 0 auto; min-width:150px; }
  .stat .lbl{ font-size:12px; }
  .stat .val{ font-size:24px; }
  .badge{ font-size:12.5px; padding:5px 12px; }
  .hdr-title .mat-sel{ font-size:17px; padding:7px 30px 7px 12px; max-width:none; }
  .hdr-title .gear{ font-size:12.5px; }
  .hdr-title .hdr-reset{ font-size:14px; padding:9px 18px; }

  /* 盤面と操作パネルを左右に並べる */
  .main{ display:grid; grid-template-columns: 1fr 400px; gap:20px;
         align-items:start; padding:20px; }
  .board{ padding:0; }

  /* マスと補助バーを大きく */
  .brow{ gap:10px; margin-bottom:16px; }
  .cell{ width:150px; flex:0 0 150px; border-radius:8px; }
  .cell .cur{ font-size:44px; padding:10px 4px 6px; }
  .cell .zn{ font-size:17px; }
  .cell .zn span{ padding:6px 0; }
  .bar{ height:26px; }
  .zone-lbl{ font-size:13px; }
  .pw-lbl{ font-size:12px; }

  /* 右カラムに入る要素 */
  .side{ position:sticky; top:88px; }
  .acc{ margin:0 0 12px; }
  .acc summary{ font-size:15px; padding:13px 16px; }
  .acc .body{ font-size:14px; padding:14px 16px; }
  table.sk{ font-size:13.5px; }
  table.sk th{ font-size:12px; padding:7px 5px; }
  table.sk td{ padding:8px 5px; }
  .plan-step{ font-size:13.5px; padding:5px 0; }
  .plan-step .tg{ font-size:12.5px; }

  /* 推奨バーは固定をやめて右カラムの上部へ */
  .foot{ position:static; border:1px solid var(--line); border-radius:10px;
         padding:16px; margin-bottom:12px; background:var(--panel); }
  .rec{ min-height:auto; margin-bottom:12px; }
  .rec-skill{ font-size:24px; }
  .rec-sub{ font-size:14px; margin-top:4px; }
  .rec-empty{ font-size:15px; }
  .calc{ font-size:17px; padding:15px; }

  /* テンキーは画面中央に */
  .modal{ align-items:center; justify-content:center; }
  .pad{ width:400px; border-radius:14px; padding:22px; }
  .pad-hd{ font-size:15px; margin-bottom:14px; }
  .pad-disp{ font-size:38px; padding:16px; }
  .keys button{ padding:19px; font-size:23px; }
  .set-row label{ font-size:13px; width:96px; flex:0 0 96px; }
  .set-row select, .set-row input{ font-size:15px; }
}

/* 大画面ではさらにゆったり */
@media (min-width: 1100px){
  .cell{ width:180px; flex:0 0 180px; }
  .cell .cur{ font-size:52px; }
  .bar{ height:30px; }
}


/* スマホでは推奨バーを画面下部に固定する */
@media (max-width: 759px){
  .main{ display:block; }
  .side{ display:contents; }
  .foot{ position:fixed; left:0; right:0; bottom:0; z-index:40;
    background:var(--bg2); border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
}


.bar-ctl{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.bar-ctl label{font-size:11.5px; color:var(--dim); white-space:nowrap;}
.bar-ctl select{flex:1; background:var(--bg2); border:1px solid var(--line); color:var(--text);
  padding:8px; border-radius:5px; font-size:15px;}
.legend{display:flex; flex-wrap:wrap; gap:5px 12px; margin-top:12px; padding:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:6px; font-size:11px; color:var(--dim);}
.legend span{display:flex; align-items:center; gap:5px;}
.legend i{width:13px; height:9px; border-radius:2px; display:inline-block; flex:0 0 13px;}
.legend .lg-blue{background:var(--blue);}
.legend .lg-red{background:var(--red);}
.legend .lg-green{background:rgba(47,138,76,.34); border:1.5px solid var(--green);}
.legend .lg-pink{background:rgba(196,26,143,.18); border:1px dashed rgba(196,26,143,.75);}
.legend .lg-cur{background:#4a3418; width:3px; flex:0 0 3px; height:13px;}
@media (min-width:760px){ .legend{font-size:12.5px;} .bar-ctl label{font-size:13px;} }


/* 手順内の地金特性マーク */
.plan-step.on-boost{ background:rgba(138,106,18,.10); border-left:3px solid var(--gold);
  padding-left:6px; border-radius:3px; }
.plan-step.on-half{ background:rgba(28,111,196,.10); border-left:3px solid var(--blue);
  padding-left:6px; border-radius:3px; }
.mk-boost{ color:var(--gold); font-size:10.5px; font-weight:800; white-space:nowrap; }
.mk-half{ color:var(--blue); font-size:10.5px; font-weight:800; white-space:nowrap; }
.mk-note{ margin-top:10px; padding-top:9px; border-top:1px solid var(--line);
  font-size:11px; color:var(--dim); line-height:1.65; }
.mk-note div{ margin-bottom:5px; }
.mk-note b{ margin-right:3px; }
@media (min-width:760px){
  .mk-boost,.mk-half{ font-size:12px; }
  .mk-note{ font-size:12.5px; }
}


/* マス番号 */
.cell{ position:relative; }
.cell .idx{ font-size:10px; color:var(--dim); text-align:center;
  padding:3px 0 0; letter-spacing:.04em; font-weight:700; }
.cell.hi .idx{ color:var(--ember); }
.cell.done .idx{ color:var(--green); }
@media (min-width:760px){ .cell .idx{ font-size:13px; padding:6px 0 0; } }


.keys.k4{ grid-template-columns:repeat(4,1fr); }
.keys .op{ background:#e6d5ae; color:var(--gold); font-size:24px; }
.keys .op.on{ background:var(--gold); color:#fbf3e0; }
.keys .cancel{ color:var(--dim); }
.pad-res{ text-align:right; font-size:15px; color:var(--gold); font-weight:700;
  margin:-6px 0 11px; min-height:20px; font-variant-numeric:tabular-nums; }
@media (min-width:760px){ .pad-res{ font-size:17px; } }


.zrow{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
.zrow .zl{font-size:11.5px; color:var(--dim); width:44px; flex:0 0 44px;}
.zrow input{flex:1; min-width:0; background:var(--bg); border:1px solid var(--line);
  color:var(--text); padding:8px 6px; border-radius:5px; font-size:16px;
  text-align:center; font-variant-numeric:tabular-nums;}
.zrow .zs{color:var(--dim); font-size:12px;}
@media (min-width:760px){ .zrow .zl{font-size:13px; width:52px; flex:0 0 52px;} }

<script>
/* ====== 状態 ====== */
const G = {
  temp: 1000,
  focus: 253,
  masses: [],
  level: 80, hammerId:'light', star:3, trait:'shuchu',
  rec: null, plan: [], barSkill:'tataku', preset:'kagayaki', barMax:null,
  // 実行済み反映で「数値の手入力待ち」になっているマス番号
  pending: [], undoSnap: null, showRange: true, hist: [], posts: null, obs: null,
  fx: null   // 値が変わった直後のマスに一度だけ動きを付ける
};
// 素材ごとのプリセット。zones は各マスの成功ゾーン[下限,上限]、
// trait はその素材が持つ地金特性(選択時に自動で切り替える)。
const PRESETS = {
  kagayaki: {
    name: '超かがやきの樹液',
    trait: 'shuchu',
    zones: [[155,161],[220,230],[155,161],[220,230],[140,150],[140,150]]
  },
  // 超あまつゆのいと(地金特性:たたき変化)
  //   400℃の倍数で威力2倍、その±200℃で威力半減。
  //   ゾーンは 左上・左下・右中が180〜190(幅11)、右上・右下が245〜251(幅7)、
  //   左中が150〜156(幅7)。盤面は縦3×横2で [1][2] / [3][4] / [5][6]。
  amatsuyu: {
    name: '超あまつゆのいと',
    trait: 'tataki',
    zones: [[180,190],[245,251],[150,156],[180,190],[180,190],[245,251]]
  }
  // 超ようせいのひだね は盤面データ未確認のため未実装
};

/* ===================== 演算エンジン ===================== */
// ---- 特技定義(みだれ打ちは対象がランダムで狙えないため除外) ----
// 開始直後(まだ1手も打っていない状態)は地金特性が発動しない。
// 開始温度1000℃は本来なら会心率+400%のタイミングだが、1手目だけは適用されない。
// 手動フラグにすると外し忘れで以降ずっと無効になってしまうため、
// 「開始温度のまま、かつ全マスが0」という盤面の状態から自動判定する。
// シミュレーション中は simFirstMove で明示的に制御する。
let simFirstMove = null;   // null=自動判定 / true,false=強制

function isStartState(){
  if(simFirstMove !== null) return simFirstMove;
  // 開始温度のまま、かつ全マスが0なら「まだ1手も打っていない」状態
  if(G.temp !== START_TEMP) return false;
  return G.masses.every(m => m.current === 0);
}

const START_TEMP = 1000;   // 鍛冶開始時の温度

const SKILLS = [
  {id:'tataku', name:'たたく', lv:1, cost:5, key:'tataku', masses:1, shape:'single', tempDelta:-50},
  {id:'jouge', name:'上下打ち', lv:2, cost:8, key:'joge', masses:2, shape:'vertical', tempDelta:-50},
  {id:'tekagen', name:'てかげん打ち', lv:3, cost:10, key:'tekagen', masses:1, shape:'single', precision:true, tempDelta:-50},
  {id:'nibai', name:'2倍打ち', lv:5, cost:8, key:'nibai', masses:1, shape:'single', tempDelta:-50},
  {id:'karyoku', name:'火力上げ', lv:7, cost:10, key:null, masses:0, shape:'none', tempDelta:300},
  {id:'yonren', name:'4連打ち', lv:11, cost:12, key:'joge', masses:4, shape:'square', tempDelta:-50},
  {id:'sanbai', name:'3倍打ち', lv:16, cost:11, key:'sanbai', masses:1, shape:'single', tempDelta:-50},
  {id:'nerai', name:'ねらい打ち', lv:23, cost:16, key:'tataku', masses:1, shape:'single', crit:true, tempDelta:-50},
  {id:'chouyonren', name:'超4連打ち', lv:27, cost:18, key:'nibai', masses:4, shape:'square', tempDelta:-50},
  {id:'hiyashikomi', name:'冷やし込み', lv:33, cost:12, key:null, masses:0, shape:'none', tempDelta:-300},
  {id:'naname', name:'ななめ打ち', lv:38, cost:7, key:'joge', masses:2, shape:'diagonal', tempDelta:-50},
  {id:'reppuu', name:'熱風おろし', lv:47, cost:6, key:'reppu', masses:1, shape:'single', tempDelta:-150},
  {id:'jouge_nerai', name:'上下ねらい打ち', lv:52, cost:25, key:'joge', masses:2, shape:'vertical', crit:true, tempDelta:-50},
  {id:'yowanerai', name:'弱ねらい打ち', lv:75, cost:20, key:'tekagen', masses:1, shape:'single', crit:true, precision:true, tempDelta:-50},
  {id:'sayuu', name:'左右打ち', lv:80, cost:8, key:'joge', masses:2, shape:'horizontal', tempDelta:-50},
];

const SKILLS_BY_ID = Object.fromEntries(SKILLS.map(s=>[s.id, s]));
let lastUsedSkillId = 'nerai'; // 判定対象は基本ねらい打ち系を使う想定なのでデフォルトはこれ

// ---- 鍛冶職人の集中力上限(Lv1〜75、Lv76〜80はデータなし) ----
const FOCUS_CAP = {
  1:50,2:52,3:53,4:56,5:57,6:60,7:61,8:64,9:67,10:67,
  11:70,12:73,13:73,14:76,15:79,16:79,17:82,18:84,19:87,20:87,
  21:90,22:93,23:93,24:96,25:98,26:101,27:101,28:104,29:109,30:109,
  31:112,32:113,33:113,34:115,35:119,36:122,37:123,38:123,39:125,40:129,
  41:132,42:134,43:137,44:139,45:139,46:142,47:142,48:144,49:147,50:149,
  51:152,52:152,53:154,54:157,55:159,56:162,57:162,58:164,59:167,60:169,
  61:171,62:171,63:173,64:175,65:177,66:180,67:182,68:184,69:186,70:188,
  71:189,72:191,73:193,74:195,75:197,
  // Lv76〜80は公開データが無いため、Lv80=208(実測の集中力253から
  // 光のハンマーの集中度45を引いた値)に向けて等間隔で補間した推定値。
  76:199,77:201,78:203,79:206,80:208,
};

// ---- 職人道具(ハンマー):集中度(開始時集中力加算)とできのよさ(★)ごとの会心率加算 ----
const HAMMERS = {
  copper:  {name:'銅の鍛冶ハンマー',   focusBonus:0,  critByStar:[1.0,1.1,1.2,2.0]},
  iron:    {name:'鉄の鍛冶ハンマー',   focusBonus:10, critByStar:[1.5,1.6,1.7,2.5]},
  silver:  {name:'銀の鍛冶ハンマー',   focusBonus:15, critByStar:[2.0,2.1,2.2,3.0]},
  platinum:{name:'プラチナ鍛冶ハンマー',focusBonus:25, critByStar:[2.5,2.6,2.7,3.5]},
  super:   {name:'超鍛冶ハンマー',     focusBonus:35, critByStar:[3.0,3.1,3.2,4.0]},
  miracle: {name:'奇跡のハンマー',     focusBonus:50, critByStar:[3.3,3.4,3.5,4.3]},
  light:   {name:'光のハンマー',       focusBonus:45, critByStar:[3.6,3.7,3.8,4.6]},
};

// ---- 会心率の計算 ----
// 最終会心率 = 基礎会心率(パッシブ累積+ハンマー★) × (1 + 地金特性ボーナス[0/4.0] + 狙い打ちボーナス[0/6.0])
function getPassiveCritPercent(level){
  let p = 0;
  if(level>=10) p += 0.1;
  if(level>=20) p += 0.2;
  if(level>=30) p += 0.3;
  return p;
}
function computeCritRate(skill, level, hammerId, star, trait, temp){
  const passive = getPassiveCritPercent(level);
  const hammer = HAMMERS[hammerId];
  // 道具会心率 = 職人スキル(パッシブ) + コツをつかんでいる + ハンマーのできのよさ
  // 「コツをつかんでいる」は同じ品を作り続けると常時付く +1.0%。
  const KOTSU = 1.0;
  const base = passive + KOTSU + (hammer ? hammer.critByStar[star] : 0); // %
  const st = traitTempState(temp);
  // 開始直後は地金特性が発動しないため、会心率ボーナスも乗らない
  const active = (typeof isStartState==='function') ? !isStartState() : true;
  const traitBonus = (trait==='shuchu' && st.mod200 && active) ? 4.0 : 0;
  const naraiBonus = skill && skill.crit ? 6.0 : 0;
  const finalPct = base * (1 + traitBonus + naraiBonus);
  return Math.max(0, Math.min(1, finalPct/100));
}

// ---- 地金特性ロジック ----
// 前提(判明分):
// ・効果は「打撃前の温度」で判定され、次に温度が変わるまで持続する(4連打ちなど複数マス同時ヒットにも同じ効果が適用される)
// ・集中力変化(shuchu):温度が400の倍数→集中力消費0.5倍。200の倍数かつ400の倍数でない→集中力消費1.5倍+会心率+400%(5倍)。威力の数値そのものへの影響はなし。
// ・たたき変化(tataki):温度が400の倍数→威力2倍。200の倍数かつ400の倍数でない→威力0.5倍(端数切り上げ)。会心が乗る場合は「たたき変化補正→切り上げ→会心の2倍」の順。
// ・威力会心率上昇(kaishin):温度が200の倍数になるたびに、ゾーン未到達のマスがランダムに1つ点灯(再抽選)。点灯マスは威力2倍+会心率大幅上昇。非点灯マスは特性なしと同じ。
// ・メーター減少・戻り(modori):温度が200の倍数に到達した瞬間、プレイヤーの操作と無関係に、ゾーン未到達かつ最も進行度が高いマスの数値が固定量(目安12〜16)減少する。
function traitTempState(temp){
  const mod400 = temp % 400 === 0;
  const mod200 = temp % 200 === 0 && !mod400;
  return { mod400, mod200 };
}

function getPowerMultiplier(trait, temp, isLitMass){
  const st = traitTempState(temp);
  if(trait === 'tataki'){
    if(st.mod400) return 2;
    if(st.mod200) return 0.5;
    return 1;
  }
  if(trait === 'kaishin' && isLitMass && (st.mod400 || st.mod200)){
    return 2;
  }
  return 1;
}

function applyPowerMultiplier(r, mult){
  if(!r || mult===1) return r;
  return { min: Math.ceil(r.min*mult), max: Math.ceil(r.max*mult) };
}

function getTraitStatusText(trait, temp){
  const st = traitTempState(temp);
  if(trait === 'shuchu'){
    if(st.mod400) return `集中力消費0.5倍のテンポ(${temp}℃)。会心率は通常です。`;
    if(st.mod200) return `集中力消費1.5倍・会心率+400%(5倍)のテンポ(${temp}℃)。会心を狙うならここです。`;
    return null;
  }
  if(trait === 'tataki'){
    if(st.mod400) return `威力2倍のテンポ(${temp}℃)。会心判定時は自動で補正されます。`;
    if(st.mod200) return `威力0.5倍(端数切り上げ)のテンポ(${temp}℃)。会心判定時は自動で補正されます。`;
    return null;
  }
  if(trait === 'kaishin'){
    if(st.mod400 || st.mod200) return `ゾーン未到達のマスのうち1つが点灯中(${temp}℃)。下の「点灯マス」で対象を選んでください。点灯マスは威力2倍+会心率大幅上昇です。`;
    return null;
  }
  if(trait === 'modori'){
    if(st.mod400 || st.mod200) return `${temp}℃はメーター減少(戻り)の判定タイミングです。下のボタンから適用してください。`;
    return null;
  }
  return null;
}

let litMassIndex = null;

// ---- ヘパイトスのほのお(必殺技)管理 ----
// ・使用すると「次の一手」全マスが会心のてごたえ確定になる(理想値到達は未確定のまま)
// ・1ターン限り。何か行動(=判定)したら、その行動で対象になった全マス分を判定し終えた時点で自動OFFになる
let hepaitosActive = false;
let hepaitosRemaining = null; // このターンで判定すべき残りマス数(未確定の間はnull)

// ---- 温度別 威力候補(最大,最小) 100℃刻み(50℃は別途) 出典:鍛冶職人の温度別数値ダメージ一覧 ----
const TEMP_POINTS = [2000,1900,1800,1700,1600,1500,1400,1300,1200,1100,1000,900,800,700,600,500,400,300,200,100,50];
const POWER_TABLE = {
  tataku:  [[27,18],[27,18],[26,17],[25,17],[24,16],[23,15],[22,15],[21,14],[20,14],[19,13],[18,12],[18,12],[17,11],[16,11],[15,10],[14,9],[13,9],[12,8],[11,8],[10,7],[10,7]],
  tekagen: [[14,9],[14,9],[13,9],[13,9],[12,8],[12,8],[11,8],[11,7],[10,7],[10,7],[9,6],[9,6],[9,6],[8,6],[8,5],[7,5],[7,5],[6,4],[6,4],[5,4],[5,4]],
  joge:    [[33,23],[32,22],[31,21],[30,21],[29,20],[28,19],[27,18],[26,18],[25,17],[24,16],[22,15],[21,15],[20,14],[19,13],[18,12],[17,12],[16,11],[15,10],[14,9],[13,9],[12,8]],
  nibai:   [[54,36],[53,35],[51,34],[49,33],[47,32],[45,30],[44,29],[42,28],[40,27],[38,26],[36,24],[35,23],[33,22],[31,21],[29,20],[27,18],[26,17],[24,16],[22,15],[20,14],[19,13]],
  sanbai:  [[81,54],[79,53],[76,51],[73,49],[71,47],[68,45],[65,44],[63,42],[60,40],[57,38],[54,36],[52,35],[49,33],[46,31],[44,29],[41,27],[38,26],[36,24],[33,22],[30,20],[29,19]],
  reppu:   [[68,45],[66,44],[63,42],[61,41],[59,39],[57,38],[54,36],[52,35],[50,33],[48,32],[45,30],[43,29],[41,27],[39,26],[36,24],[34,23],[32,21],[30,20],[27,18],[null,null],[null,null]],
};

/* 威力は温度の一次式で決まり、表示値はそれを丸めたもの。
   実測テーブルは100℃刻みしか無いが、実際の温度は50℃刻みで動く
   (打撃-50 / 熱風-150 / 冷やし-300 / 火力+300)。
   従来はテーブル間を線形補間して小数のまま7個の候補を作っていたため、
   1450℃のような温度で候補の一部が1ずれていた。
   テーブルから一次式を復元し、丸めた整数を返す。 */
const POWER_FIT = (()=>{
  const fit = {};
  for(const key of Object.keys(POWER_TABLE)){
    const out = [];
    for(const j of [0,1]){
      let n=0,sx=0,sy=0,sxx=0,sxy=0;
      TEMP_POINTS.forEach((t,i)=>{
        const v = POWER_TABLE[key][i][j];
        if(v == null) return;
        n++; sx+=t; sy+=v; sxx+=t*t; sxy+=t*v;
      });
      const a = (n*sxy - sx*sy) / (n*sxx - sx*sx);
      out.push([a, (sy - a*sx)/n]);
    }
    fit[key] = { max: out[0], min: out[1] };
  }
  return fit;
})();

function interpolate(key, temp){
  if(!key) return null;
  {
    const f = POWER_FIT[key];
    if(f){
      const t = Math.max(50, Math.min(2000, temp));
      const mx = Math.round(f.max[0]*t + f.max[1]);
      const mn = Math.round(f.min[0]*t + f.min[1]);
      // テーブルに実測値がある温度は、式より実測を優先する
      const i = TEMP_POINTS.indexOf(t);
      if(i >= 0 && POWER_TABLE[key][i][0] != null)
        return { max: POWER_TABLE[key][i][0], min: POWER_TABLE[key][i][1] };
      return { max: mx, min: Math.min(mn, mx) };
    }
  }
  // 2000℃超は威力が頭打ちで、2000℃と同じロールになる。
  // 2500℃で撃っても2000℃と同じ値しか出ない。
  const t = Math.max(50, Math.min(2000, temp));
  for(let i=0;i<TEMP_POINTS.length-1;i++){
    const hi = TEMP_POINTS[i], lo = TEMP_POINTS[i+1];
    if(t<=hi && t>=lo){
      const [maxHi,minHi] = POWER_TABLE[key][i];
      const [maxLo,minLo] = POWER_TABLE[key][i+1];
      if(maxHi===null || maxLo===null) return null;
      const ratio = hi===lo ? 0 : (t-lo)/(hi-lo);
      return { max: maxLo + (maxHi-maxLo)*ratio, min: minLo + (minHi-minLo)*ratio };
    }
  }
  const last = POWER_TABLE[key][TEMP_POINTS.length-1];
  return last[0]===null ? null : {max:last[0], min:last[1]};
}




// ---- 推奨計算(期待値ベースの最後までの見通しシミュレーション) ----
// 乱数は使わず、会心率・威力を期待値として扱い、集中力が尽きる/温度が0になるまでを
// 貪欲法(各局面で最も誤差合計を下げる一手を選ぶ)で最後まで1本道シミュレートする。
// これを「今打てる候補手」それぞれについて行い、最終的な誤差期待値が一番小さくなる
// 最初の一手を推奨として提示する。
// 制約(簡略化):複数マス同時ヒット系特技の対象マスは、盤面の隣接関係までは考慮せず
// 「ゾーン未到達かつ必要量が大きいマス」を優先的に選ぶ近似で計算している。


// ============================================================
//  演算エンジン:大成功(誤差合計7以下)の確率を最大化する
// ============================================================
// 【設計の柱】
//  1. 到達が絶対条件。1マスでも成功ゾーンに入らなければ大成功はない。
//  2. 超過は回復不能。飛び越えたマスは二度と直せないので強く避ける。
//  3. 熱風おろし(-150)+通常行動(-50)=-200 で、特殊温度を2手ごとに渡り歩く。
//     集中力変化の地金では200の倍数で会心率+400%、400の倍数で消費半減が
//     交互に来るため、このリズムに乗せると会心機会が飛躍的に増える。
//  4. 会心狙いは「到達に必要な集中力を確保した上での余剰」で行う。
//
// この構成での実測は、大成功率 約39%、全マス到達率 約97%。
// (Lv80 / 光のハンマー★3 / 集中力252 / 超かがやきの樹液を想定)

const GRID_ROWS = 3, GRID_COLS = 2; // 縦3×横2(超かがやきの樹液)
const SUCCESS_THRESHOLD = 7;        // 6マス商材の大成功ライン(誤差合計)
const MAX_ERR = 4;                  // ゾーン内の誤差キャップ

// 推奨手の重み。実測で最も大成功率が高くなった値。
// 推奨手の重み。いずれも実測(各数千〜1.5万回のシミュレーション)で決めた値。
//   cap  : 会心が理想値を捉える見込み
//   adv  : 前進量あたりの効率
//   land : 特殊温度に着地することの価値
//   heat : 温度が足りない時に火力上げへ切り替える閾値
//   ov   : ゾーン超過のリスク(超過は回復不能)
//   pr   : 遅れているマスを優先する度合い
//   te   : 本会心ゾーンにいるマスを狙い打つ価値
//   rush : まだ会心の見込みが無いマスをゾーンへ押し込む手の抑制
//          (ゾーンに入るマスの56%が遠方からの飛び込みで、
//           会心のチャンスを得ないまま終わっていたため)
// 推奨手の重み。すべて実測(各数千〜1.5万回のシミュレーション)で決めた値。
//   cap  : 会心が理想値を捉える見込み
//   adv  : 前進量あたりの効率
//   land : 特殊温度に着地することの価値
//   heat : 温度不足で火力上げに切り替える閾値
//   ov   : ゾーン超過のリスク(超過は回復不能)
//   pr   : 遅れているマスを優先する度合い
//   te   : 本会心ゾーンにいるマスを狙い打つ価値
//   rush : 会心の見込みが無いマスをゾーンへ押し込む手の抑制
//   save : 消費半減ターンで、節約額の大きい技を選ぶ度合い
//   turn : 特殊温度(会心+400% / 消費半減)に乗る手を優先する度合い
const PARAMS = { cap:12, adv:0.75, land:3, heat:4, ov:4, pr:0.8, tmax:2200,
                 te:5, rush:0.6, save:25, turn:5, tatakiFit:1.5, boostPlan:1, center:3, opening:1, wideAim:2, pairSnipe:1, far:5, mpm:16, slack:1, effK:4, slackMax:2, saveCap:0.7, boostAim:0.7, boostRes:24 };

function idxToRC(i){ return { r: Math.floor(i/GRID_COLS), c: i%GRID_COLS }; }
function rcToIdx(r,c){
  if(r<0||r>=GRID_ROWS||c<0||c>=GRID_COLS) return null;
  return r*GRID_COLS+c;
}

// 技ごとの対象マスの組み合わせを、盤面の隣接関係に沿って列挙する
function enumerateTargetSets(skill){
  const sets = [];
  if(skill.masses===0) return [[]];
  if(skill.masses===1){
    for(let i=0;i<GRID_ROWS*GRID_COLS;i++) sets.push([i]);
    return sets;
  }
  for(let r=0;r<GRID_ROWS;r++){
    for(let c=0;c<GRID_COLS;c++){
      const base = rcToIdx(r,c);
      if(base===null) continue;
      if(skill.shape==='vertical'){
        const b = rcToIdx(r+1,c);
        if(b!==null) sets.push([base,b]);
      } else if(skill.shape==='horizontal'){
        const b = rcToIdx(r,c+1);
        if(b!==null) sets.push([base,b]);
      } else if(skill.shape==='diagonal'){
        const b = rcToIdx(r+1,c-1);
        if(b!==null) sets.push([base,b]);
      } else if(skill.shape==='square'){
        const a=rcToIdx(r,c), b=rcToIdx(r,c+1), d=rcToIdx(r+1,c), e=rcToIdx(r+1,c+1);
        if(a!==null&&b!==null&&d!==null&&e!==null) sets.push([a,b,d,e]);
      }
    }
  }
  return sets;
}

// 地金特性「集中力変化」による消費の増減
//  400の倍数 → 消費半減 / 200の倍数(400除く) → 消費1.5倍だが会心率+400%
function traitActive(temp){
  return !isStartState();
}
function actualCostOf(sk, temp, trait){
  if(trait!=='shuchu') return sk.cost;
  if(!traitActive(temp)) return sk.cost;     // 開始直後は特性が乗らない
  if(temp%400===0) return Math.max(1, Math.round(sk.cost*0.5));
  if(temp%200===0) return Math.round(sk.cost*1.5);
  return sk.cost;
}
// 消費半減 / 会心率+400% は地金特性「集中力変化」でのみ発生する。
// 他の特性(たたき変化など)では、同じ温度でも別の効果になるため false を返す。
const isHalfTurn  = t => traitActive(t) && G.trait==='shuchu' && t%400===0;
const isBoostTurn = t => traitActive(t) && G.trait==='shuchu' && t%200===0 && t%400!==0;

// たたき変化:400の倍数で威力2倍、200の倍数(400除く)で威力半減
const isPowerUpTurn   = t => traitActive(t) && G.trait==='tataki' && t%400===0;
const isPowerDownTurn = t => traitActive(t) && G.trait==='tataki' && t%200===0 && t%400!==0;

// その温度・技での7候補のロール値(整数、四捨五入)
function getRollCandidates(skill, temp, trait, isLit){
  if(!skill.key) return null;
  const baseR = interpolate(skill.key, temp);
  if(!baseR) return null;
  const mult = getPowerMultiplier(trait, temp, isLit);
  const r = applyPowerMultiplier(baseR, mult);
  const out = [];
  for(let k=0;k<7;k++) out.push(Math.round(r.min + (r.max-r.min)*k/6));
  return out;
}

// 超過リスクのあるマスは「今は触らない」のが正解。
// 全体の温度を下げると他マスの効率まで落ちるが、そのマスを後回しにして
// 他を進めれば、打撃のたびに温度は自然に下がり、やがて安全圏に入る。
// 冷やし込みが要るとしても、他が片付いた最後の場面に限られる。
function moves(ms,f,t,cfg){
  const strict=[], loose=[];
  for(const sk of SKILLS){
    if(sk.lv>cfg.level||sk.id==='midare')continue;
    const c=actualCostOf(sk,t,cfg.trait);
    if(c>f)continue;
    const nt=Math.max(0,t+sk.tempDelta);
    if(nt<=0)continue;
    if(sk.masses===0){ strict.push({sk,tg:[],c,nt,overP:0}); continue; }
    const r=getRollCandidates(sk,t,cfg.trait,false);
    if(!r)continue;
    for(const tg of enumerateTargetSets(sk)){
      if(tg.some(i=>ms[i].current>=ms[i].zoneLow))continue;
      let maxOver=0;
      for(const i of tg){
        let cnt=0;
        for(const x of r) if(ms[i].current+x>ms[i].zoneHigh) cnt++;
        maxOver=Math.max(maxOver,cnt/r.length);
      }
      const mv={sk,tg,c,nt,overP:maxOver};
      if(maxOver===0) strict.push(mv);
      else loose.push(mv);
    }
  }
  if(strict.some(m=>m.sk.masses>0)) return strict;
  // 安全に打てる打撃手が無い = 未到達マスがすべて超過圏にある状態。
  // ここまで来て初めて冷やし込みに価値が出る(他マスへの巻き添えがないため)。
  const cool=[];
  for(const sk of SKILLS){
    if(sk.lv>cfg.level||sk.masses!==0||sk.tempDelta>=0)continue;
    const c=actualCostOf(sk,t,cfg.trait);
    if(c>f)continue;
    const nt=Math.max(0,t+sk.tempDelta);
    if(nt<=0)continue;
    // 下げた先で安全に打てるようになるか
    let ok=false;
    for(const s2 of SKILLS){
      if(s2.lv>cfg.level||s2.masses===0||s2.id==='midare')continue;
      const r2=getRollCandidates(s2,nt,cfg.trait,false);
      if(!r2||actualCostOf(s2,nt,cfg.trait)>f-c)continue;
      for(const tg2 of enumerateTargetSets(s2)){
        if(tg2.some(i=>ms[i].current>=ms[i].zoneLow))continue;
        let safe=true;
        for(const i of tg2) if(ms[i].current+r2[6]>ms[i].zoneHigh){safe=false;break;}
        if(safe){ok=true;break;}
      }
      if(ok)break;
    }
    if(ok) cool.push({sk,tg:[],c,nt,overP:0,cooling:true});
  }
  if(cool.length>0) return strict.concat(cool);
  // ここに来た = 安全に打てる手も冷却で解決する手も無く、
  // 超過覚悟で撃つしかない状態。だがその前に、温度を下げれば
  // ロール値そのものが縮んで収まる可能性がある。
  // 残り1のマスは500℃以下、残り2は700℃以下でないと収まらないため、
  // 冷却が複数回必要なこともある。集中力が許すなら冷却を優先する。
  const rescue=[];
  for(const sk of SKILLS){
    if(sk.lv>cfg.level||sk.id==='midare')continue;
    if(sk.tempDelta>=0)continue;
    const c=actualCostOf(sk,t,cfg.trait);
    if(c>f)continue;
    const nt=Math.max(0,t+sk.tempDelta);
    if(nt<=0)continue;
    // 下げ続ければ最終的に収まるか(集中力が尽きるまで試算)
    let tt=nt, ff=f-c, reachable=false;
    for(let k=0;k<8;k++){
      let ok=false;
      for(const m of ms){
        if(m.current>=m.zoneLow)continue;
        for(const s2 of SKILLS){
          if(s2.lv>cfg.level||s2.masses===0||s2.id==='midare')continue;
          const r2=getRollCandidates(s2,tt,cfg.trait,false);
          if(!r2)continue;
          if(actualCostOf(s2,tt,cfg.trait)>ff)continue;
          if(m.current+r2[6]<=m.zoneHigh){ok=true;break;}
        }
        if(ok)break;
      }
      if(ok){reachable=true;break;}
      const c2=actualCostOf(sk,tt,cfg.trait);
      if(c2>ff||tt+sk.tempDelta<=0)break;
      ff-=c2; tt=Math.max(0,tt+sk.tempDelta);
    }
    if(!reachable)continue;
    if(sk.masses===0){ rescue.push({sk,tg:[],c,nt,overP:0,cooling:true}); }
    else{
      const r=getRollCandidates(sk,t,cfg.trait,false);
      if(!r)continue;
      let added=false;
      for(const tg of enumerateTargetSets(sk)){
        if(tg.some(i=>ms[i].current>=ms[i].zoneLow))continue;
        let safe=true;
        for(const i of tg) if(ms[i].current+r[6]>ms[i].zoneHigh){safe=false;break;}
        if(safe){ rescue.push({sk,tg,c,nt,overP:0,cooling:true}); added=true; }
      }
      // 対象マスを持つ技を「対象なし」で出してはいけない。
      // 熱風おろしはロールがたたくの約2.5倍あり、実際に撃てば必ずどこかのマスが伸びる。
      // 対象なしで出すと、その前進量が計算から消えたまま推奨されることになり、
      // プレイヤーが実行した瞬間に盤面と予測がずれる。
      // 安全な対象が無い場合は、超過が最も小さい対象を選び、その超過リスクを明示する。
      if(!added){
        let bestTg = null, bestOv = Infinity;
        for(const tg of enumerateTargetSets(sk)){
          if(tg.some(i=>ms[i].current>=ms[i].zoneLow))continue;
          let ov = 0;
          for(const i of tg){
            let cnt = 0;
            for(const x of r) if(ms[i].current+x>ms[i].zoneHigh) cnt++;
            ov = Math.max(ov, cnt/r.length);
          }
          if(ov < bestOv){ bestOv = ov; bestTg = tg; }
        }
        if(bestTg) rescue.push({sk,tg:bestTg,c,nt,overP:bestOv,cooling:true});
      }
    }
  }
  if(rescue.length>0) return strict.concat(rescue);
  loose.sort((a,b)=>a.overP-b.overP);
  return strict.concat(loose.slice(0,12));
}
function needTotal(ms){return ms.reduce((a,m)=>a+Math.max(0,m.zoneLow-m.current),0);}

// --- 戦術A: 効率貪欲(温度を意識しない) ---
function stratA(ms,f,t){
  const mv=moves(ms,f,t,cfg);
  if(mv.length===0)return null;
  let best=null,be=-1;
  for(const x of mv){
    if(x.sk.masses===0){
      if(x.cooling){
        const sc=1.2+((isHalfTurn(x.nt)||isBoostTurn(x.nt))?P.land:0);
        if(sc>bs){bs=sc;best=x;}
        continue;
      }
      // 温度が足りない時だけ火力上げ
      const steps=Math.floor(t/50), need=needTotal(ms);
      if(x.sk.id==='karyoku'&&need/28>steps-3&&t<2200){ if(be<0){be=0;best=x;} }
      continue;
    }
    const r=getRollCandidates(x.sk,t,cfg.trait,false);
    const v=r[Math.floor(r.length/2)];
    let adv=0;for(const i of x.tg)adv+=Math.min(v,ms[i].zoneLow-ms[i].current);
    const e=adv/x.c;
    if(e>be){be=e;best=x;}
  }
  return best;
}

// --- 戦術B: リズム戦術 ---
// 熱風(-150)+通常(-50)=-200 で特殊温度を渡り歩く。
// 半減ターンは消費が1/3なので狙い打ちを連打、会心ターンは高会心率の一撃。
// たたき変化(超あまつゆのいと)の開幕定跡。
// 実プレイヤーが共有している手順で、倍加ターンに大技を合わせ、
// 半減ターンを一度も踏まずに進める。
//   1600★ 熱風(最遠マス) → 2050まで加熱 → 2000★ 超4連 → 1600★ 4連
// 現状のエンジンは効率だけで選ぶため、半減ターンで打撃したり
// 通常ターンで超4連を撃ったりと、倍加の恩恵を取りこぼしていた。
let P_OPEN_TH = 0.65;
let REPPUU_STREAK = 0;

// 上下ねらい打ちは2マス同時に本会心を狙える唯一の技。
// 消費25で2マス分なので、単発のねらい打ち(16×2=32)より安い。
function pairSnipe(ms, f, t, cfg){
  const jn = SKILLS.find(s => s.id === 'jouge_nerai' && s.lv <= cfg.level);
  if(!jn) return null;
  const c = actualCostOf(jn, t, cfg.trait);
  if(c > f) return null;
  const r = getRollCandidates(jn, t, cfg.trait, false);
  if(!r) return null;
  for(const tg of enumerateTargetSets(jn)){
    if(tg.some(i => ms[i].current >= ms[i].zoneLow)) continue;
    const ok = tg.every(i => {
      const m = ms[i];
      return m.current + r[6] <= m.zoneHigh && m.current + 2*r[0] >= m.zoneHigh;
    });
    if(ok) return { sk: jn, tg, c, nt: Math.max(0, t + jn.tempDelta), overP: 0 };
  }
  return null;
}

function tatakiOpening(ms, f, t, cfg){
  if(cfg.trait !== 'tataki') return null;
  const K  = SKILLS.find(s => s.id === 'karyoku'    && s.lv <= cfg.level);
  const R  = SKILLS.find(s => s.id === 'reppuu'     && s.lv <= cfg.level);
  const C4 = SKILLS.find(s => s.id === 'chouyonren' && s.lv <= cfg.level);
  const Y4 = SKILLS.find(s => s.id === 'yonren'     && s.lv <= cfg.level);
  const NN = SKILLS.find(s => s.id === 'naname'     && s.lv <= cfg.level);
  const TK = SKILLS.find(s => s.id === 'tataku'     && s.lv <= cfg.level);
  if(!K || !R || !C4 || !Y4 || !NN || !TK) return null;
  const mk = (sk, tg) => {
    const c = actualCostOf(sk, t, cfg.trait);
    if(c > f) return null;
    const r = sk.masses > 0 ? getRollCandidates(sk, t, cfg.trait, false) : null;
    if(sk.masses > 0){
      if(!r) return null;
      for(const i of tg) if(ms[i].current + r[6] > ms[i].zoneHigh) return null;
    }
    return { sk, tg, c, nt: Math.max(0, t + sk.tempDelta), overP: 0 };
  };
  const untouched = ms.every(m => m.current === 0);

  // --- 手1〜3: 1600℃(倍加)まで加熱し、最も遠いマスへ熱風 ---
  if(untouched){
    if(t < 1600) return mk(K, []);
    // 実プレイヤーの定跡では、この熱風は必ず A(左上) に入れる。
    // A は幅11で本会心の価値が高く、超4連の対象[C,D,E,F]から漏れるため、
    // ここで先に進めておかないと後半で追いつかなくなる。
    if(t === 1600){
      const mv = mk(R, [0]);
      if(mv) return mv;
    }
  }

  // 定跡は序盤のみ。盤面が進んだら通常評価へ委ねる。
  const progress = ms.reduce((a,m)=>a+Math.min(m.current, m.zoneLow), 0);
  const need = ms.reduce((a,m)=>a+m.zoneLow, 0);
  if(progress > need * (P_OPEN_TH || 0.65)) return null;

  // --- 超4連の直後: Bをたたき、BとFへ順に熱風を入れる ---
  // 2000℃の超4連は C・D・E・F を叩くため、A と B が取り残される。
  // B は最も遠いゾーン(245)なので、たたく+熱風で追い上げる。
  // 熱風2回で -300℃ となり、次の倍加ターン(1600℃)にちょうど乗る。
  // この処理は「2000℃の超4連を撃ち終えた直後」に限る。
  // 判定: C・D・E・F が進んでいて、かつ温度が2000℃未満に落ちている。
  if(t < 2000 && t >= 1600 && ms[2].current > 50 && ms[3].current > 50
     && ms[4].current > 0 && ms[5].current > 0){
    const B = 1, F = 5;
    // Bがまだ手つかずなら1回たたく(熱風の下地を作る)
    if(ms[B].current === 0){
      const mv = mk(TK, [B]);
      if(mv) return mv;
    }
    // BとFのうち低い方へ熱風。目標(zoneHigh-60)に届くまで
    const rr = getRollCandidates(R, t, cfg.trait, false);
    if(rr){
      const order = ms[B].current <= ms[F].current ? [B, F] : [F, B];
      for(const i of order){
        if(ms[i].current >= ms[i].zoneHigh - 60) continue;
        if(ms[i].current + rr[6] > ms[i].zoneHigh) continue;
        const mv = mk(R, [i]);
        if(mv) return mv;
      }
    }
  }

  // --- 倍加ターン: 4マス技を安全に撃つ ---
  if(isPowerUpTurn(t)){
    for(const sk of [C4, Y4]){
      const r = getRollCandidates(sk, t, cfg.trait, false);
      if(!r) continue;
      for(const tg of enumerateTargetSets(sk)){
        if(!tg.every(i => ms[i].current < ms[i].zoneLow && ms[i].current + r[6] <= ms[i].zoneHigh)) continue;
        const mv = mk(sk, tg);
        if(mv) return mv;
      }
    }
  }

  // --- 倍加ターンの1手前: 4連打ちで軽く詰める ---
  // 超4連をここで撃つと次の倍加ターンで突き抜けて撃てなくなる。
  if(isPowerUpTurn(t - 50)){
    for(const sk of [Y4, NN, SKILLS.find(s=>s.id==='sayuu'), TK]){
      if(!sk || sk.lv > cfg.level) continue;
      const r = getRollCandidates(sk, t, cfg.trait, false);
      if(!r) continue;
      for(const tg of enumerateTargetSets(sk)){
        if(!tg.every(i => ms[i].current < ms[i].zoneLow && ms[i].current + r[6] <= ms[i].zoneHigh)) continue;
        const rc = getRollCandidates(C4, t - 50, cfg.trait, false);
        if(rc && tg.some(i => ms[i].current + r[6] + rc[6] > ms[i].zoneHigh)) continue;
        const mv = mk(sk, tg);
        if(mv) return mv;
      }
    }
  }

  // --- 加熱: 次の倍加ターンへ乗せる ---
  if(t + 300 <= 2400){
    const after = t + 300;
    if(isPowerUpTurn(after) || isPowerUpTurn(after - 50)) return mk(K, []);
  }
  return null;
}

function stratB(ms,f,t,P,cfg){
  // ---- 2マス同時の本会心を最優先 ----
  if(P.pairSnipe > 0){
    const ps = pairSnipe(ms, f, t, cfg);
    if(ps) return ps;
  }

  // ---- 会心ターンは本会心の回収に使う ----
  // 会心率が5倍になるこのターンの価値は、本会心を取れる時にしか出ない。
  // 実測では会心ターンの打撃3.77回のうち超4連打ちが1.61回を占め、
  // 会心1.97回を発生させながら本会心は0.44回(22%)しか拾えていなかった。
  // 捕捉できる見込みがあるマスがあるなら、狙い打ち系を優先する。
  if(P.boostAim > 0 && isBoostTurn(t)){
    const cand = moves(ms, f, t, cfg);
    let bA = null, bV = -1;
    for(const x of cand){
      if(!x.sk.crit || !x.sk.key || f < x.c) continue;
      const tg = x.tg.filter(i => ms[i].current < ms[i].zoneLow);
      if(!tg.length) continue;
      const r = getRollCandidates(x.sk, t, cfg.trait, false);
      if(!r) continue;
      let sum = 0;
      for(const i of tg){
        const m = ms[i], zn = m.zoneHigh - m.zoneLow + 1;
        let c = 0;
        for(const rv of r){
          const reach = m.current + 2*rv; let n = 0;
          for(let id = m.zoneLow; id <= m.zoneHigh; id++) if(id > m.current && id <= reach) n++;
          c += (n/zn)/r.length;
        }
        sum += c;
      }
      if(sum / tg.length < P.boostAim) continue;      // 捕捉の見込みが薄いなら見送る
      // 残るマスを仕上げる集中力を確保できる時だけ撃つ
      const rest = ms.filter(m => m.current < m.zoneLow).length - tg.length;
      if(f - x.c < rest * (P.boostRes === undefined ? 24 : P.boostRes)) continue;
      const cr = computeCritRate(x.sk, cfg.level, cfg.hammerId, cfg.star, cfg.trait, t);
      const v = sum * cr / x.c;
      if(v > bV){ bV = v; bA = x; }
    }
    if(bA) return bA;
  }

  // ---- たたき変化の開幕定跡 ----
  if(P.opening > 0 && cfg.trait === 'tataki'){
    const open = tatakiOpening(ms, f, t, cfg);
    if(open) return open;
  }

  // ---- 会心ターン活用モード ----
  // 集中力に余裕があり、全未到達マスを会心ターンで仕留める計画が
  // 成立する局面では、その計画に沿って動く。
  // 通常ターンで狙い打ちを撃つと会心率36%だが、会心ターンまで待てば57%。
  // ただし温度が下がるとロール値が落ち、届かなくなるマスが出るため、
  // 「どのマスをどの会心ターンで仕留めるか」まで含めて検算した上で発動する。
  // 計画が成立しない(集中力が足りない等)なら、以降の通常評価に落ちる。
  if(P.boostPlan > 0){
    const bp = buildBoostPlan(ms, f, t, cfg);
    if(bp){
      const step = bp.seq[0];
      if(step){
        if(step.type === 'kill'){
          // 今この温度で仕留められるマスがある
          const sets = enumerateTargetSets(step.sk).filter(g =>
            g.includes(step.mass) && g.every(i => ms[i].current < ms[i].zoneLow));
          if(sets.length){
            const c = actualCostOf(step.sk, t, cfg.trait);
            if(c <= f) return {sk: step.sk, tg: sets[0], c, nt: Math.max(0, t + step.sk.tempDelta), overP: 0};
          }
        } else {
          // 次の会心ターンへ温度を下げる
          const hiya = SKILLS.find(s => s.id === 'hiyashikomi' && s.lv <= cfg.level);
          if(hiya && t - step.to >= 300){
            const c = actualCostOf(hiya, t, cfg.trait);
            if(c <= f) return {sk: hiya, tg: [], c, nt: Math.max(0, t - 300), overP: 0};
          }
          // 端数は、未到達マスを進めすぎない最安の打撃で刻む
          let pick = null, pc = Infinity;
          for(const s of SKILLS){
            if(s.lv > cfg.level || s.masses !== 1 || s.id === 'midare') continue;
            if(s.tempDelta !== -50) continue;
            const c = actualCostOf(s, t, cfg.trait);
            if(c < pc){ pc = c; pick = s; }
          }
          if(pick && pc <= f){
            // 進めても計画が崩れないマスを選ぶ(最も遅れているマス)
            const r = getRollCandidates(pick, t, cfg.trait, false);
            let idx = -1, worst = -1;
            for(let i = 0; i < ms.length; i++){
              if(ms[i].current >= ms[i].zoneLow) continue;
              if(r && ms[i].current + r[6] > ms[i].zoneHigh) continue;   // 超過させない
              const gap = ms[i].zoneLow - ms[i].current;
              if(gap > worst){ worst = gap; idx = i; }
            }
            if(idx >= 0) return {sk: pick, tg: [idx], c: pc, nt: Math.max(0, t - 50), overP: 0};
          }
        }
      }
    }
  }

  P=P||{cap:7,adv:0.75,land:3,heat:4,ov:4,pr:0.8,tmax:2200,te:20};
  const mv=moves(ms,f,t,cfg);
  if(mv.length===0)return null;
  const need=needTotal(ms);
  const steps=Math.floor(t/50);
  // 消費半減ターン(400の倍数)では重い技が半額で撃てる。
  // ここで火力上げを使うのは、その機会を捨てることになる。
  // 打撃で前進できる場面なら、火力上げは半減ターン以外に回す。
  // ただし温度が本当に足りない時は火力上げを優先する。
  // 半減ターンを守って温度切れになれば元も子もない。
  // 会心+400%ターン(200の倍数)で火力上げを撃つのは無駄。
  // 消費が1.5倍になるうえ、火力上げは会心の恩恵を一切受けないため。
  // 一方、消費半減ターン(400の倍数)なら火力上げも半額で撃てるので問題ない。
  // ただし温度切れが目前なら、機会損失より到達を優先する。
  const urgentHeat = need/28 > steps-3;
  // 除外するのは会心+400%ターンのみ。
  // 半減ターンは火力上げ自体も半額(消費5)で撃てるので、むしろ有利。
  const specialTurn = isBoostTurn(t) && !urgentHeat
                      && ms.some(m=>m.current<m.zoneLow);

  // 温度が足りなければ火力上げ
  if(!specialTurn && need/28 > steps-P.heat && t < (P.tmax||2200)){
    const k=mv.find(x=>x.sk.id==='karyoku');
    if(k)return k;
  }

  // 到達は絶対条件。未到達マスを全部ゾーンに入れるのに必要な集中力を見積もり、
  // それを下回る余剰しかない場合は、会心狙いをやめて最安の確実な手に切り替える。
  // (実測では弱ねらい打ちを連打して残り1で集中力が尽きる失敗が多発していた)
  let reserve=0;
  for(const m of ms){
    if(m.current>=m.zoneLow) continue;
    const gap=m.zoneLow-m.current;
    // そのマスをゾーンに入れられる最安の手を探す
    let cheapest=Infinity;
    for(const sk of SKILLS){
      if(sk.lv>cfg.level||sk.masses===0||sk.id==='midare')continue;
      const c=actualCostOf(sk,t,cfg.trait);
      const r=getRollCandidates(sk,t,cfg.trait,false);
      if(!r)continue;
      // 最小ロールで届き、最大ロールで超過しないこと
      if(m.current+r[0]>=m.zoneLow && m.current+r[6]<=m.zoneHigh){
        cheapest=Math.min(cheapest,c);
      }
    }
    if(!isFinite(cheapest)){
      // 一撃で入らないなら、必要打数ぶんの概算
      let bestEff=0, cost1=8;
      for(const sk of SKILLS){
        if(sk.lv>cfg.level||sk.masses===0||sk.id==='midare')continue;
        const r=getRollCandidates(sk,t,cfg.trait,false);
        if(!r)continue;
        const c=actualCostOf(sk,t,cfg.trait);
        const e=((r[0]+r[6])/2)/c;
        if(e>bestEff){bestEff=e;cost1=c;}
      }
      cheapest = bestEff>0 ? Math.ceil(gap/bestEff) : gap;
    }
    reserve += cheapest;
  }
  const spare = f - reserve;          // 会心狙いに使える余剰
  const tight = spare < 0;            // 到達すら危うい

  let best=null,bs=-1;
  for(const x of mv){
    if(x.sk.masses===0){
      if(x.cooling){
        const sc=1.2+((isHalfTurn(x.nt)||isBoostTurn(x.nt))?P.land:0);
        if(sc>bs){bs=sc;best=x;}
        continue;
      }
      continue;
    }
    const r=getRollCandidates(x.sk,t,cfg.trait,false);
    const cr=computeCritRate(x.sk,cfg.level,cfg.hammerId,cfg.star,cfg.trait,t);
    const v=r[Math.floor(r.length/2)];
    let adv=0,cap=0,prio=0;
    for(const i of x.tg){
      const m=ms[i];
      adv+=Math.min(v,m.zoneLow-m.current);
      // 多マス技の対象になりにくいマスは最後に取り残され、
      // 低温・低集中力で処理する羽目になって誤差が膨らむ。
      // 残り距離が大きいマスほど優先して片付ける。
      prio += (m.zoneLow-m.current)/Math.max(1,m.zoneLow);
      // 会心が理想値を捉える確率。
      // 「会心の伸びが理想値を通過する」割合なので、これがそのまま
      // 本会心になる見込みを表す。ゾーンから遠ければ自然に0に近づく。
      const zn=m.zoneHigh-m.zoneLow+1;
      let c2=0;
      for(const rr of r){const reach=m.current+2*rr;let n=0;
        for(let id=m.zoneLow;id<=m.zoneHigh;id++)if(id>m.current&&id<=reach)n++;
        c2+=(n/zn)/r.length;}
      cap+=cr*c2;
    }
    // 次が特殊温度になるかを評価に入れる
    const landBonus=(isHalfTurn(x.nt)||isBoostTurn(x.nt))?P.land:0;
    // 会心を捉える価値を主軸に、前進効率と特殊温度到達を加える
    // 余剰が無い局面では会心を狙わず、到達を確実にする手を選ぶ。
    // 高コストの狙い打ちは、余剰で賄える時だけ価値がある。
    // 実測では、余剰がほぼ無いのに弱ねらい打ち(消費20〜30)を連打して
    // 残り1〜7で集中力が尽きる失敗が支配的だった。
    // 「その手を打った後も、残る全マスを最安手で入れ切れるか」を厳格に判定する。
    const afterCost = f - x.c;
    // 残るマス数 × 最安の一撃(温度が下がると変わるので保守的に8とみなす)
    let openAfter = 0;
    for(let i=0;i<ms.length;i++){
      if(ms[i].current>=ms[i].zoneLow) continue;
      // この手で入る見込みがあるマスは除く
      if(x.tg.includes(i)){
        const r3=getRollCandidates(x.sk,t,cfg.trait,false);
        if(r3 && ms[i].current+r3[0]>=ms[i].zoneLow) continue;
      }
      openAfter++;
    }
    // 未到達1マスあたりに残しておく集中力。実測で16が最適(失敗率を有意に下げ、大成功率は不変)
    const MIN_PER_MASS = (P.mpm === undefined ? 16 : P.mpm);
    const safeAfter = afterCost >= openAfter*MIN_PER_MASS;
    const affordable = safeAfter;
    const capW = (tight||!safeAfter) ? 0 : P.cap;
    // 前進効率は「集中力が足りない時にだけ」意味を持つ指標。
    // 余剰が大きい局面では、安くて伸びる技が本会心の価値を押し流してしまうため、
    // 余剰の大きさに応じて効率項の重みを落とす。
    // 残りに必要な集中力の見積り。マス数だけで測ると、まだ遠いマスが多い中盤を
    // 「余裕あり」と誤判定するため、残り前進量そのものから見積もる。
    let restAdv = 0;
    for(let i=0;i<ms.length;i++){
      const d = ms[i].zoneLow - ms[i].current;
      if(d > 0) restAdv += d;
    }
    const effK = (P.effK === undefined ? 4 : P.effK);
    const needF = Math.max(openAfter * MIN_PER_MASS, restAdv / effK, 1);
    const slack = Math.max(0, afterCost - needF);
    // 余剰が確実に見えるのは終盤(残りマスが少ない時)だけ。中盤で緩めると
    // 集中力を使い切って失敗が増えるため、残りマス数で発動を絞る。
    const slackOn = openAfter > 0 && openAfter <= (P.slackMax === undefined ? 1 : P.slackMax);
    const advW  = slackOn ? P.adv / (1 + (P.slack||0) * slack / needF) : P.adv;
    // ゾーンに確実に入る手(最小ロールで届き最大ロールで超えない)を優遇
    let sureIn=0;
    {
      const r2=getRollCandidates(x.sk,t,cfg.trait,false);
      if(r2) for(const i of x.tg){
        const m=ms[i];
        if(m.current+r2[0]>=m.zoneLow && m.current+r2[6]<=m.zoneHigh) sureIn++;
      }
    }
    // 会心率が上がるターンは消費も1.5倍になるため、
    // 会心そのものに価値があるわけではない。
    // 価値があるのは「本会心ゾーンにいるマスを、会心で理想値ちょうどに止める」時だけ。
    // ゾーンから遠いマスに会心が出ても、ただ2倍伸びるだけで大成功には寄与しない。
    //
    // 逆に、本会心ゾーンに入っているマスを通常技で撃つのは機会損失になる。
    // 実測では1ゲームあたり1.6回もこの取りこぼしが起きていた。
    // 誤差0のマスを4つ揃えれば大成功率は81%に達するため、
    // 本会心ゾーンのマスは狙い打ち系で仕留めることを強く優先する。
    let turnEff = 0;
    if(x.sk.masses>0 && x.sk.key){
      const critRate = computeCritRate(x.sk, cfg.level, cfg.hammerId, cfg.star, cfg.trait, t);
      let pinkVal = 0;
      for(const i of x.tg){
        const m = ms[i];
        if(m.current >= m.zoneLow) continue;
        // 今まさに使おうとしている技で、この位置から本会心が成立するか。
        // 判定は技ごとに行う(倍率が違えば成立範囲も違うため)。
        if(m.current + r[6] > m.zoneHigh) continue;      // 条件1:はみ出す
        if(m.current + 2*r[0] < m.zoneHigh) continue;    // 条件2:会心でも届かない

        // 成立していても、位置によって価値は大きく違う。
        // 外した時にゾーン手前で止まれば撃ち直せるが、
        // ゾーン内に着弾すると誤差がその場で確定してしまう。
        // 実測では同じ本会心ゾーン内でも期待誤差が1.18〜6.36と5倍以上開くため、
        // 二値で数えず、期待誤差の小ささを価値として使う。
        let e = 0, n = 0;
        for(let id = m.zoneLow; id <= m.zoneHigh; id++){
          for(const rv of r){
            const land = m.current + rv;
            const inZ = land >= m.zoneLow && land <= m.zoneHigh;
            const eN = inZ ? Math.min(Math.abs(land - id), MAX_ERR) : Math.abs(land - id);
            e += (1 - critRate) * eN;   // 会心なら誤差0なので加算しない
            n++;
          }
        }
        const expErr = e / n;
        pinkVal += Math.max(0, MAX_ERR - expErr) / MAX_ERR;   // 誤差が小さいほど高評価
      }
      // ゾーン幅によって狙い打ちの価値が変わる。
      // 幅11のマスは中央に入れても誤差4が出るため、本会心で誤差0にする価値が高い。
      // 幅7のマスは中央着弾で誤差3以下に収まるので、高コストの狙い打ちは割に合わない。
      // (実プレイヤーも「本会心を狙うのは幅11の3箇所」としている)
      // 幅11の3マスだけ本会心を取れば期待誤差5.14で大成功圏に入る。
      let widthW = 1;
      if(P.wideAim > 0){
        let wide = 0, narrow = 0;
        for(const i of x.tg){
          const m = ms[i];
          if(m.current >= m.zoneLow) continue;
          if(m.zoneHigh - m.zoneLow + 1 >= 10) wide++; else narrow++;
        }
        if(wide + narrow > 0) widthW = (wide * P.wideAim + narrow) / (wide + narrow);
      }
      // 幅11のマス(A・D・E)は本会心の価値が高いが、
      // A と E は2マス技のペア相手が限られ(A:[AB][AC] E:[EF][CE])、
      // 相手の必要前進量が大きく離れるため同時に本会心圏へ入れにくい。
      // 実測では本会心圏での射撃が A/E は38%、他マスは50%前後だった。
      // 単発のねらい打ちで拾えるよう、これらへの狙いを後押しする。
      // 幅11マスへの単発優遇(lone)は検証で効果なしと判明したため撤去した。
      turnEff = (critRate * pinkVal) / x.c * P.te * widthW;

    }







    // ---- 飛び込み抑制 ----
    // 実測では、ゾーンに入ったマスの56%が「遠方から一気に飛び込んだ」もので、
    // 撃ち直し圏を経由したのはわずか1.5%だった。
    // 本会心ゾーンに"置く"ことを加点しても、そもそも通過せず飛び越えているため効かない。
    // そこで逆に、まだ撃ち直し圏より手前にいるマスを、
    // 会心の見込みなくゾーンへ押し込む手を抑制する。
    let rushPenalty = 0;
    if(x.sk.masses>0 && x.sk.key && P.rush>0 && !x.sk.crit){
      const rt4 = getRollCandidates(SKILLS.find(s=>s.id==='tataku'), t, cfg.trait, false);
      if(rt4){
        for(const i of x.tg){
          const m = ms[i];
          if(m.current >= m.zoneLow) continue;
          // 本会心を狙える位置の下限(技ごとに求めた範囲の和)
          const cz2 = critZoneRange(m.zoneLow, m.zoneHigh, t, cfg.level, cfg.trait);
          if(!cz2) continue;
          const rlo = cz2[0];
          if(m.current >= rlo) continue;      // 既に圏内なら関係ない
          // この手でゾーンに飛び込んでしまう確率(=会心チャンスを失う)
          let jump = 0;
          for(const rv of r){ if(m.current + rv >= m.zoneLow) jump++; }
          rushPenalty += jump / r.length;
        }
      }
    }
    turnEff -= rushPenalty * P.rush;


    // ---- 特殊温度への到達(案B) ----
    // 実測では手番の59%が特性の乗らない通常ターンだった。
    // 熱風おろし(-150)と通常打撃(-50)を組み合わせれば -200 で
    // 2手ごとに特殊温度へ行けるので、その回数自体を増やす価値がある。
    let turnVal = 0;
    if(P.turn>0){
      const nt = x.nt;
      if(isBoostTurn(nt) || isHalfTurn(nt)) turnVal += 1;
      else {
        // 次の一手で特殊温度に届くなら、それも評価する
        for(const s2 of SKILLS){
          if(s2.lv>cfg.level || s2.id==='midare') continue;
          const n2 = Math.max(0, nt + s2.tempDelta);
          if(n2>0 && (isBoostTurn(n2) || isHalfTurn(n2))){ turnVal += 0.4; break; }
        }
      }
    }
    turnEff += turnVal * P.turn;

    // ---- たたき変化への対応 ----
    // この特性では威力そのものが変わる(400の倍数で2倍、その中間で半減)。
    // 威力2倍ターンは遠いマスを一気に詰めるのに向き、
    // 威力半減ターンはゾーン間近の微調整に向く。
    // 温度によって「今どちらの用途に適した局面か」が変わるため、
    // マスの残り距離と噛み合っているかを評価する。

    if(P.tatakiFit>0 && x.sk.masses>0 && x.sk.key){
      let fit = 0;
      const up = isPowerUpTurn(t), down = isPowerDownTurn(t);
      if(up || down){
        for(const i of x.tg){
          const m = ms[i];
          if(m.current >= m.zoneLow) continue;
          const gap = m.zoneLow - m.current;
          const mean = (r[0] + r[6]) / 2;
          // 旧実装は「残り距離が平均ロールの1.5倍を超えるか」で判定していたため、
          // 威力の大きい技ほど平均ロールが大きくなり、常に減点される欠陥があった。
          // (実測では倍加ターンで超4連が一度も選ばれず、4連打ちに負けていた)
          // 倍加ターンの価値は「大技を安全に撃てること」なので、
          // 超過しない範囲でどれだけ前進できるかで評価する。
          if(up){
            const over = m.current + r[6] > m.zoneHigh;
            fit += over ? -1 : Math.min(1, mean / Math.max(1, gap));
          }
          if(down) fit += gap < mean*2.5 ? 1 : -0.3;   // 半減は近いマス向き
        }
      }
      turnEff += fit * P.tatakiFit;
    }

    // ---- 着弾位置の最適化 ----
    // 会心で理想値を捉えられない場合でも、ゾーン内のどこに着弾するかで
    // 期待誤差が変わる(幅11なら端3.09、中央2.55)。
    // 実測では着弾がゾーン全体にほぼ均一に散らばっており、
    // 6マス合計で理論最良13.61に対し15.09と1.48損していた。
    // 誤差0が3マスの局面では、この差が大成功の可否を分ける。
    // 幅7のマスは中央着弾で誤差3以下に収まる(幅11は中央でも誤差4)。
    // 狙い打ちに頼らず中央へ入れるだけで大成功圏に近づくため、
    // 狭いゾーンほど着弾位置の最適化を重く見る。
    let center = 0;
    if(P.center>0 && x.sk.masses>0 && x.sk.key){
      for(const i of x.tg){
        const m = ms[i];
        if(m.current >= m.zoneLow) continue;
        // 本会心が成立する位置なら、会心で誤差0を狙う方が優先。
        // 着弾位置の最適化は「会心では捉えられない」場合の次善策なので、
        // 本会心を狙える局面では評価しない(競合して会心狙いを潰すため)。
        if(m.current + r[6] <= m.zoneHigh && m.current + 2*r[0] >= m.zoneHigh) continue;
        // さらに「この一手でゾーンに入る」場合だけに限定する。
        // 遠い位置から中央を狙おうとすると、多マス技で一度に進める効率を捨てて
        // 集中力が足りなくなる(実測で確認)。
        // ゾーンに入る最後の一手なら、他マスへの影響なく位置を選べる。
        if(m.current + r[0] < m.zoneLow) continue;
        // この技のロールごとに、着弾位置の期待誤差を平均する
        let sum = 0, cnt = 0;
        for(const rv of r){
          const land = m.current + rv;
          if(land < m.zoneLow || land > m.zoneHigh) continue;   // ゾーン外は別評価
          let e = 0, n = 0;
          for(let id = m.zoneLow; id <= m.zoneHigh; id++){
            e += Math.min(Math.abs(land - id), MAX_ERR); n++;
          }
          sum += e/n; cnt++;
        }
        if(cnt > 0){
          // ゾーン内に入るロールの割合が高く、その期待誤差が小さいほど良い
          const avgErr = sum / cnt;
          const inRate = cnt / r.length;
          center += (MAX_ERR - avgErr) * inRate;
        }
      }
    }
    turnEff += center * P.center;

    // ---- 消費半減ターンの活用 ----
    // 半減ターンの価値は「本来高コストな技を安く撃てる」点にある。
    // ただし節約額だけで加点すると、本会心が成立しない位置でも
    // 狙い打ち系(節約額が大きい)を選んでしまう。
    // 実測では狙い打ち6回中3回が本会心圏外で撃たれ、集中力43を空費していた。
    // 価値があるのは「撃つべき技が、たまたま半減ターンで安い」時だけなので、
    // その技を撃つ意味がある場合に限って節約額を評価する。
    if(isHalfTurn(t) && x.sk.masses>0){
      let worth = false;
      if(x.sk.crit){
        // 狙い打ち系は、会心が理想値を捉える見込みがある時に意味がある。
        // 「最大ロールでもゾーンをはみ出さない」ことまで求めると、
        // ゾーン直前まで詰めたマスでは、どの技を使ってもはみ出す局面で
        // 狙い打ちだけが失格になる。判定は cap 項と同じ捕捉確率に揃える。
        const th = (P.saveCap === undefined ? 0.7 : P.saveCap);
        for(const i of x.tg){
          const m = ms[i];
          if(m.current >= m.zoneLow) continue;
          const zn = m.zoneHigh - m.zoneLow + 1;
          let c3 = 0;
          for(const rv of r){
            const reach = m.current + 2*rv; let n = 0;
            for(let id = m.zoneLow; id <= m.zoneHigh; id++) if(id > m.current && id <= reach) n++;
            c3 += (n/zn)/r.length;
          }
          if(c3 >= th){ worth = true; break; }
        }
      } else {
        // 通常技は前進が仕事なので、未到達マスを叩けるなら意味がある
        worth = x.tg.some(i => ms[i].current < ms[i].zoneLow);
      }
      if(worth) turnEff += ((x.sk.cost - x.c) / 10) * P.save;
    }

    // ---- 会心+400%ターンの活用(案A) ----
    // 半減ターンと対になる考え方。会心率が5倍になるこのターンの価値は、
    // 「本会心ゾーンにいるマスを狙い打って仕留める」時にしか発揮されない。
    // 実測では会心ターンの58%が本会心ゾーンを狙えておらず、
    // 最多の超4連打ちに至っては一度も狙えていなかった。
    // そこで、狙い打ち系で本会心ゾーンを撃つ手を強く優先し、

    // ---- 特殊温度への到達(案B) ----
    // 実測では全手数の59%が特性の乗らない通常ターンだった。
    // 熱風おろし(-150)と通常打撃(-50)を組み合わせれば2手で次の特殊温度に届くので、
    // 通常ターンにいる間は、次が特殊温度になる手を優先して特殊ターンの回数を増やす。
    // 局面ごとに重みを切り替える案は検証したが、
    // 単体テストでは有効に見えても実プレイでは前進が止まり到達率が落ちた。
    // 到達は大成功の絶対条件なので、重みは全局面で共通とする。
    // ゾーンが遠いマスほど到達に手数がかかる。
    // 超あまつゆのいとの B・F は必要前進量が245と最大なのに、
    // 4マス技[ABCD][CDEF]では片方ずつしか叩けず取り残されやすい。
    // 実測では未到達の91%がこの2マスだった。
    let farBonus = 0;
    if(P.far > 0){
      let maxGap = 0, myGap = 0;
      for(let i = 0; i < ms.length; i++){
        const gp = ms[i].zoneLow - ms[i].current;
        if(gp > maxGap) maxGap = gp;
      }
      for(const i of x.tg){
        const gp = ms[i].zoneLow - ms[i].current;
        if(gp > myGap) myGap = gp;
      }
      if(maxGap > 0) farBonus = (myGap / maxGap) * P.far;
    }
    const score=cap*capW + (adv/x.c)*advW + landBonus + prio*P.pr + farBonus
              + sureIn*(tight?3.0:1.0) + turnEff - (x.overP||0)*P.ov;
    if(score>bs){bs=score;best=x;}
  }
  return best;
}


// 現局面から推奨手順どおりに打ち切った場合の成績を、乱数試行で実測する。
// 理想値は見えないので試行ごとにサンプリングし、その平均を取る。
/* ====== 理想値の事後分布 ======
   打撃のたびに「打撃前の値・技のロール候補・会心の有無・打撃後の値」から
   理想値の確率分布を絞り込む。会心が通常ロールと同じ値で止まって理想値に
   はまる場合があるため、会心の有無は必ず観測値として受け取る。 */
// 事後分布から理想値を1つ引く。分布が無ければゾーン内の一様乱数に戻す。
function sampleIdeal(i, m){
  const p = (G.posts && G.posts[i] && G.posts[i].length === m.zoneHigh - m.zoneLow + 1)
          ? G.posts[i] : null;
  if(!p) return m.zoneLow + Math.floor(Math.random()*(m.zoneHigh - m.zoneLow + 1));
  let r = Math.random(), acc = 0;
  for(let k=0;k<p.length;k++){ acc += p[k]; if(r <= acc) return m.zoneLow + k; }
  return m.zoneHigh;
}
function freshPost(m){ const n = m.zoneHigh - m.zoneLow + 1; return new Array(n).fill(1/n); }
function ensurePosts(){
  if(!Array.isArray(G.posts) || G.posts.length !== G.masses.length){
    G.posts = G.masses.map(freshPost);
  }
  for(let i=0;i<G.masses.length;i++){
    const need = G.masses[i].zoneHigh - G.masses[i].zoneLow + 1;
    if(!Array.isArray(G.posts[i]) || G.posts[i].length !== need) G.posts[i] = freshPost(G.masses[i]);
  }
}
function updatePost(i, before, rolls, critRate, after, wasCrit){
  ensurePosts();
  const m = G.masses[i], lo = m.zoneLow, post = G.posts[i], out = [];
  for(let k=0;k<post.length;k++){
    const v = lo + k;
    let n1 = 0, n2 = 0;
    for(const r of rolls){
      if(before + r === after) n1++;
      if(Math.min(before + 2*r, v) === after) n2++;
    }
    let L;
    if(wasCrit === true)       L = n2 / rolls.length;
    else if(wasCrit === false) L = n1 / rolls.length;
    else                       L = (1-critRate) * n1 / rolls.length + critRate * n2 / rolls.length;
    out.push(post[k] * L);
  }
  const sum = out.reduce((a,b)=>a+b, 0);
  if(sum > 0) G.posts[i] = out.map(x => x / sum);
}
// 各マスの誤差分布を畳み込んで、誤差合計7以下の確率を出す
function greatProbFromPosts(masses, posts){
  let dist = [1];
  for(let i=0;i<masses.length;i++){
    const m = masses[i];
    if(m.current < m.zoneLow) return null;          // 未到達があれば確定できない
    const e = [0,0,0,0,0];
    for(let k=0;k<posts[i].length;k++){
      e[Math.min(Math.abs(m.current - (m.zoneLow + k)), 4)] += posts[i][k];
    }
    const nd = new Array(Math.min(dist.length + 4, 30)).fill(0);
    for(let a=0;a<dist.length;a++) for(let b=0;b<5;b++) nd[Math.min(a+b,29)] += dist[a] * e[b];
    dist = nd;
  }
  let p = 0;
  for(let i=0;i<=7 && i<dist.length;i++) p += dist[i];
  return p;
}
// 理想値が絞り込めていない(分布が一様のまま)マス数。
// 通常ロールの結果は理想値の手がかりにならないので、入力しても一様のまま残る
// 全マス到達後は、理想値の分布から大成功率を直接出せる。
// 未入力のマスがある場合は確定できないので、最良・最悪の幅で示す。
function rateFromPosts(detail){
  // 超過はゾーンを通り越した状態で、回復手段が無い。大成功はあり得ない
  if(G.masses.some(m => m.current > m.zoneHigh)) return '0%(超過)';
  if(!G.masses.every(m => m.current >= m.zoneLow)) return null;
  ensurePosts();
  const p = greatProbFromPosts(G.masses, G.posts);
  if(p == null) return null;
  const unk = unknownCount();
  if(unk === 0) return (p*100).toFixed(0) + '%';
  if(!detail) return (p*100).toFixed(0) + '%';
  // 未確定マスを誤差0とみなした上限
  const best = G.posts.map((q,i)=>{
    const arr = q.slice();
    if(arr.every(x=>Math.abs(x-arr[0])<1e-9)){
      const k = G.masses[i].current - G.masses[i].zoneLow;
      return arr.map((_,j)=> j===k ? 1 : 0);
    }
    return arr;
  });
  const hi = greatProbFromPosts(G.masses, best);
  return (p*100).toFixed(0) + '%(理想値が未確定のマスが' + unk
       + '。すべて誤差0なら' + (hi*100).toFixed(0) + '%)';
}
function unknownCount(){
  ensurePosts();
  let n = 0;
  for(let i=0;i<G.masses.length;i++){
    const p = G.posts[i];
    if(p.every(x => Math.abs(x - p[0]) < 1e-9)) n++;
  }
  return n;
}

function estimateOutcome(masses, focus, temp, cfg, trials){
  const savedSim = simFirstMove;
  const startsFresh = isStartState();
  let win=0, errSum=0, reach=0;
  const errs=[];
  for(let n=0;n<trials;n++){
    simFirstMove = startsFresh;      // この試行の1手目だけ特性を無効にする
    // 理想値は一様乱数ではなく、これまでの観測から絞り込んだ分布から引く。
    // 一様のままだと、本会心で誤差0が確定しているマスまで期待誤差2.7として
    // 扱われ、終盤ほど実態から外れる。
    const ms = masses.map((m,i)=>({
      current:m.current, zoneLow:m.zoneLow, zoneHigh:m.zoneHigh,
      ideal: sampleIdeal(i, m)
    }));
    let f=focus, t=temp;
    for(let s=0;s<70;s++){
      if(ms.every(m=>m.current>=m.zoneLow)) break;
      if(t<=0) break;
      const mv = stratB(ms, f, t, PARAMS, cfg);
      if(!mv || f<mv.c) break;
      const rolls = mv.sk.key ? getRollCandidates(mv.sk, t, cfg.trait, false) : null;
      const cr = mv.sk.key ? computeCritRate(mv.sk, cfg.level, cfg.hammerId, cfg.star, cfg.trait, t) : 0;
      if(rolls) mv.tg.forEach(i=>{
        const m=ms[i];
        if(m.current>=m.zoneLow) return;
        const roll = rolls[Math.floor(Math.random()*rolls.length)];
        if(Math.random()<cr){ if(m.current<m.ideal) m.current=Math.min(m.current+2*roll, m.ideal); }
        else m.current += roll;
      });
      f-=mv.c; t=mv.nt;
      simFirstMove = false;   // 1手打ったので以降は特性が有効
    }
    let e=0, r=0;
    ms.forEach(m=>{
      const raw=Math.abs(m.current-m.ideal);
      const inZone = m.current>=m.zoneLow && m.current<=m.zoneHigh;
      if(m.current>=m.zoneLow) r++;
      e += inZone ? Math.min(raw,MAX_ERR) : raw;
    });
    if(e<=SUCCESS_THRESHOLD) win++;
    if(r===6) reach++;
    errSum+=e; errs.push(e);
  }
  simFirstMove = savedSim;
  errs.sort((a,b)=>a-b);
  return {
    successRate: win/trials,
    avgError: errSum/trials,
    medError: errs[Math.floor(trials/2)],
    reachRate: reach/trials
  };
}



/* ===================== UI制御 ===================== */
/* ====== 描画 ====== */
function cfgOf(){
  return {level:G.level, hammerId:G.hammerId, star:G.star, trait:G.trait};
}

// バーの最大値(全マス共通)。設定で手入力された値があればそれを使い、
// 無ければ全マスのゾーン上限の最大値に少し余裕を足した値を自動で決める。
function barScaleMax(){
  if(G.barMax && G.barMax > 0) return G.barMax;
  let hi = 0;
  for(const m of G.masses) if(m.zoneHigh > hi) hi = m.zoneHigh;
  return Math.max(50, Math.ceil((hi * 1.15) / 10) * 10);
}

// ===== 会心ターン活用プランの動的計算 =====
// 所要集中力は局面によって変わる。
//   ・残りマス数、各マスの残り距離
//   ・現在温度から各会心ターンまでの距離
//   ・どのマスがどの会心ターンで仕留められるか
// これらから毎回計算し、収まる場合のみ発動する。

// そのマスをその温度で仕留められる最安の技(なければ null)
function killerAt(m, temp, cfg){
  let best = null, bc = Infinity;
  for(const s of SKILLS){
    if(!s.crit || s.lv > cfg.level) continue;
    const r = getRollCandidates(s, temp, cfg.trait, false);
    if(!r) continue;
    if(m.current + r[6] > m.zoneHigh) continue;      // はみ出す
    if(m.current + 2*r[0] < m.zoneHigh) continue;    // 会心でも届かない
    // 多マス技を1マスにしか使わないなら割高。1マスあたりで比較する。
    const c = actualCostOf(s, temp, cfg.trait);
    if(c < bc){ bc = c; best = s; }
  }
  return best ? {sk: best, cost: bc} : null;
}

// 現在温度から到達しうる会心ターンを列挙(近い順)
function boostTempsFrom(t){
  const out = [];
  for(let tt = t; tt >= 100; tt -= 50){
    if(tt % 200 === 0 && tt % 400 !== 0) out.push(tt);
  }
  return out;
}

// 温度Aから温度Bへ下げるコスト(冷やし込み優先、端数は最安の打撃で刻む)
function coolCost(from, to, cfg){
  if(from <= to) return {cost: 0, steps: 0};
  const hiya = SKILLS.find(s => s.id === 'hiyashikomi' && s.lv <= cfg.level);
  let cur = from, cost = 0, steps = 0, guard = 0;
  while(cur > to && guard++ < 30){
    const diff = cur - to;
    if(diff >= 300 && hiya){
      cost += actualCostOf(hiya, cur, cfg.trait);
      cur -= 300; steps++;
    } else {
      // 打撃で刻む。最安の単発技(前進してしまうが仕方ない)
      let cheap = Infinity;
      for(const s of SKILLS){
        if(s.lv > cfg.level || s.masses !== 1 || s.id === 'midare') continue;
        if(s.tempDelta !== -50) continue;
        cheap = Math.min(cheap, actualCostOf(s, cur, cfg.trait));
      }
      if(!isFinite(cheap)) return null;
      cost += cheap; cur -= 50; steps++;
    }
  }
  return cur === to ? {cost, steps} : null;
}

// 会心ターンを使い切る計画を立て、総コストを返す。
// 各マスは「仕留められる会心ターンのうち最も遅いもの」に割り当てる。
// 高温でしか撃てないマスを先に処理しないと取りこぼすため。
function buildBoostPlan(masses, focus, temp, cfg){
  if(cfg.trait !== 'shuchu') return null;
  const open = masses.map((m,i)=>({m, i})).filter(x => x.m.current < x.m.zoneLow);
  if(open.length === 0) return null;

  const boosts = boostTempsFrom(temp);
  if(boosts.length === 0) return null;

  // 各マスについて、仕留められる会心ターンを調べる
  const cand = [];
  for(const {m, i} of open){
    const list = [];
    for(const bt of boosts){
      const k = killerAt(m, bt, cfg);
      if(k) list.push({temp: bt, ...k});
    }
    if(list.length === 0) return null;      // どの会心ターンでも仕留められない
    cand.push({i, m, list});
  }

  // 仕留められる機会が少ないマスから順に割り当てる。
  // 機会が1つしかないマスはそこへ固定するしかないため、先に確保する。
  cand.sort((a,b) => a.list.length - b.list.length);
  const assign = new Map();                 // temp -> [{i, cost, sk}]
  for(const c of cand){
    // 割り当て先は「仕留めコスト + そこまでの移動コスト」が最小の会心ターン。
    // 単に最も低温を選ぶと、移動コストが膨らんで成立しなくなる。
    let best = null, bestCost = Infinity;
    for(const opt of c.list){
      // 既にその温度へ行く予定があるなら移動コストは追加で要らない
      const already = assign.has(opt.temp);
      const mv = already ? {cost: 0} : coolCost(temp, opt.temp, cfg);
      if(!mv) continue;
      const total = opt.cost + mv.cost;
      if(total < bestCost){ bestCost = total; best = opt; }
    }
    if(!best) return null;
    if(!assign.has(best.temp)) assign.set(best.temp, []);
    assign.get(best.temp).push({i: c.i, cost: best.cost, sk: best.sk});
  }

  // 温度が高い順に巡り、移動コストと仕留めコストを積む
  const used = [...assign.keys()].sort((a,b) => b - a);
  let cur = temp, total = 0;
  const seq = [];
  for(const bt of used){
    const mv = coolCost(cur, bt, cfg);
    if(!mv) return null;
    total += mv.cost;
    if(mv.steps > 0) seq.push({type: 'move', to: bt, cost: mv.cost});
    cur = bt;
    for(const a of assign.get(bt)){
      total += a.cost;
      seq.push({type: 'kill', mass: a.i, sk: a.sk, cost: a.cost, temp: bt});
      cur -= 50;                            // 撃つたびに温度が下がる
    }
    if(total > focus) return null;
  }
  return {cost: total, seq, spare: focus - total};
}

// ある位置から本会心を狙える技を探す。
// 条件は技ごとに異なる:
//   条件1「その技の最大ロールでもゾーンをはみ出さない」 pos + max ≦ zoneHigh
//   条件2「その技の会心(2倍)最小でゾーン上限まで届く」   pos + 2×min ≧ zoneHigh
// 倍率が違えば成立範囲も変わるため、技を合成して1つの範囲にしてはいけない。
// 例(幅6・1200℃):上下ねらい127〜136 / ねらい133〜141 / 弱ねらい147〜151。
// 上下ねらいの上限を超えても、弱ねらいならまだ本会心を狙える。
function critSkillsAt(pos, zoneHigh, temp, level, trait){
  const out = [];
  for(const s of SKILLS){
    if(!s.crit || s.lv > level) continue;
    const r = getRollCandidates(s, temp, trait, false);
    if(!r) continue;
    if(pos + r[6] > zoneHigh) continue;        // 条件1
    if(pos + 2*r[0] < zoneHigh) continue;      // 条件2
    out.push(s);
  }
  return out;
}

// そのマスで本会心を狙える位置の全体範囲(どれか1つでも技が成立する範囲)
function critZoneRange(zoneLow, zoneHigh, temp, level, trait){
  let lo = Infinity, hi = -Infinity;
  for(const s of SKILLS){
    if(!s.crit || s.lv > level) continue;
    const r = getRollCandidates(s, temp, trait, false);
    if(!r) continue;
    const a = zoneHigh - 2*r[0];     // この位置以上なら会心で届く
    const b = zoneHigh - r[6];       // この位置以下ならはみ出さない
    if(a > b) continue;              // その技では成立しない
    lo = Math.min(lo, a);
    hi = Math.max(hi, b);
  }
  if(!isFinite(lo)) return null;
  return [Math.max(0, lo), hi];
}

// そのマスについて、バー上の各マーカー位置を求める。
// 推奨技の有無にかかわらず常に表示する(基準técは G.barSkill で切り替え)。
//   緑   = 成功ゾーン
//   ピンク = ここから狙い打てば、会心時に確実に本会心になる範囲
//   青   = 選んだ技を通常ロールで打った時の到達範囲(最小〜最大)
//   赤   = 同じ技で会心(2倍)が出た時の到達範囲(最小〜最大)
//   白   = 現在値
function markersFor(m, skill){
  const lo = m.zoneLow, hi = m.zoneHigh;
  // バーの左端は常に0に固定する。ゾーン付近だけを拡大すると
  // 「どこまで進んだか」の実感が持てないため、0からの絶対位置で示す。
  // バーの目盛りは全マス共通にする。
  // マスごとに終点が違うと、同じ長さでも意味が変わって比較できないため。
  // 既定は全マスのゾーン上限のうち最大値に余裕を持たせた値。設定で変更できる。
  const scaleMin = 0;
  const scaleMax = barScaleMax();
  const pct = v => Math.max(0, Math.min(100, (v-scaleMin)/(scaleMax-scaleMin)*100));

  const out = {
    zone:[pct(lo), pct(hi)], cur:pct(m.current),
    pink:null, blue:null, red:null,
    raw:{ lo, hi, cur:Math.round(m.current) }
  };

  // 本会心ゾーン:技ごとに成立範囲が違うので、その和をとる
  const cz = critZoneRange(lo, hi, G.temp, G.level, G.trait);
  if(cz){
    out.pink = [pct(cz[0]), pct(cz[1])];
    out.raw.pink = [Math.round(cz[0]), Math.round(cz[1])];
  }

  if(skill && skill.key){
    const r = getRollCandidates(skill, G.temp, G.trait, false);
    if(r){
      const n0=m.current+r[0], n1=m.current+r[6];
      const c0=m.current+2*r[0], c1=m.current+2*r[6];
      out.blue = [pct(n0), pct(n1)];
      out.red  = [pct(c0), pct(c1)];
      out.raw.blue = [Math.round(n0), Math.round(n1)];
      out.raw.red  = [Math.round(c0), Math.round(c1)];
    }
  }
  return out;
}

// バー下の数値列。右向き(右列)は 通常最小→通常最大→会心最小→会心最大 の順、
// 左向き(左列)はその鏡像になるよう並べ替える。
function scaleLabel(mk, flip){
  const r = mk.raw;
  if(!G.showRange) return '';
  if(!r.blue) return '<span style="color:var(--dim)">技を選ぶと表示</span>';
  const items = [
    {v:r.blue[0], c:'var(--blue)'},
    {v:r.blue[1], c:'var(--blue)'},
    {v:r.red[0],  c:'var(--red)'},
    {v:r.red[1],  c:'var(--red)'}
  ];
  const arr = flip ? items.slice().reverse() : items;
  return arr.map(x=>`<span style="color:${x.c}">${x.v}</span>`).join('<span style="color:#a89268">〜</span>');
}
